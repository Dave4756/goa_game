<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <title>고아 카드 게임</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="game-container">
        <div id="main-menu" class="screen active">
            <h1>🔥 고아 카드 게임 🔥</h1>
            <div class="menu-buttons">
                <button type="button" onclick="changeScreen('nickname-screen')">닉네임 설정</button>
                <button type="button" onclick="changeScreen('deck-screen')">덱 편성</button>
                <button type="button" onclick="startMatchmakingProcess()">봇 대전</button>
            </div>
        </div>

        <div id="nickname-screen" class="screen">
            <h2>닉네임 설정</h2>
            <p>현재 닉네임: <span id="display-nickname">플레이어1</span></p>
            <input type="text" id="nickname-input" maxlength="20" autocomplete="nickname" placeholder="사용할 닉네임 입력">
            <button type="button" onclick="saveNickname()">저장하기</button>
            <button type="button" class="back-btn" onclick="changeScreen('main-menu')">돌아가기</button>
        </div>

        <div id="deck-screen" class="screen">
            <h2>덱 빌딩</h2>
            <p>카드를 드래그하거나 클릭하여 덱을 구성하세요 (동일 카드 최대 2장)</p>
            <div class="deck-container">
                <div class="card-list-box">
                    <h3>보관함</h3>
                    <div id="card-collection" class="card-grid"></div>
                </div>
                <div class="deck-list-box">
                    <h3>내 덱 (<span id="deck-count">0</span>장)</h3>
                    <div id="my-deck" class="card-grid"></div>
                </div>
            </div>
            <button type="button" class="back-btn" onclick="changeScreen('main-menu')">돌아가기</button>
        </div>

        <div id="coin-screen" class="screen">
            <h2>선공 / 후공 결정</h2>
            <div id="coin-container">
                <div id="coin" class="coin">
                    <div class="coin-face front">앞 (선공)</div>
                    <div class="coin-face back">뒤 (후공)</div>
                </div>
            </div>
            <p id="coin-result-text" style="font-size:20px; margin-top:20px;">동전을 던지는 중...</p>
        </div>

        <div id="battle-screen" class="screen">
            <div id="battle-board">
                <div class="field-zone" id="opponent-field-zone">
                    <h3>상대: <span id="opponent-name">허수아비 봇</span></h3>
                    <div id="opponent-field-slots" class="multi-slot-container"></div>
                </div>

                <hr style="border-color:rgba(255,255,255,.2); width:100%; margin:5px 0;">

                <div class="field-zone" id="player-field-dropzone" ondragover="allowDrop(event)" ondrop="dropToField(event)">
                    <h3>내 필드 (<span id="display-player-name">플레이어1</span>) - 드래그해서 배치</h3>
                    <div id="player-field-slots" class="multi-slot-container"></div>
                </div>

                <div class="hand-zone" id="battle-player-hand"></div>

                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:5px;">
                    <span id="turn-indicator" style="font-weight:bold; color:#2ecc71;">시작 몬스터 배치</span>
                    <div id="battle-action-info" style="font-size:12px; color:#3498db;">손패에서 시작 몬스터 1장을 필드에 배치하세요.</div>
                    <button type="button" onclick="endMyTurn()">턴 종료 (스킵)</button>
                    <button type="button" class="back-btn" style="margin:0;" onclick="changeScreen('main-menu')">포기하고 나가기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 순서 중요: Socket.IO → 게임 → 네트워크 → 배치 동기화 → 기능팩 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js?v=10"></script>
    <script src="network.js?v=10"></script>
    <script src="sync_core_v10.js?v=10"></script>
</body>
</html>
