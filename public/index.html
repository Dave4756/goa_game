<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임 | GOA Card Game</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui,sans-serif;background:#0c1120 url('/image/background.png') center/cover fixed no-repeat;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:#07101c99;z-index:-1}.wrap{max-width:1180px;margin:auto;padding:24px}.logo{text-align:center;font-size:clamp(32px,7vw,72px);margin:35px 0 8px;text-shadow:0 4px 20px #000}.logo small{display:block;font-size:.32em;color:#bbd3ff}.menu{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:28px}.mainBtn{font-size:18px;padding:15px 30px;border:1px solid #9bb8ff;border-radius:14px;background:#263c75dd;color:#fff;cursor:pointer;box-shadow:0 8px 22px #0008}.mainBtn:hover{transform:translateY(-2px);background:#3b58a0}.panel{display:none;background:#111a2aee;border:1px solid #728bc3;border-radius:18px;padding:18px;margin-top:18px}.panel.on{display:block}.cards,.field,.hand{display:flex;gap:12px;flex-wrap:wrap}.card{width:175px;position:relative;background:#202b43;border:2px solid #52698f;border-radius:14px;padding:10px;box-shadow:0 7px 16px #0007}.card img{width:100%;height:125px;object-fit:cover;border-radius:9px;background:#111}.card h3{font-size:16px;margin:7px 0}.card p{font-size:12px;margin:5px 0;color:#dbe4ff}.card button,.save{border:0;border-radius:8px;padding:8px;background:#6885df;color:white;cursor:pointer;margin:3px}.qty{position:absolute;top:5px;right:5px;background:#ffbd38;color:#111;border-radius:50%;width:28px;height:28px;text-align:center;padding-top:4px;font-weight:bold}.muted{color:#b9c5dd}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{font-size:17px;padding:12px;border-radius:10px;border:1px solid #8294b8;min-width:260px}.selected{outline:3px solid #ffcf48}.hidden{display:none!important}#toast{position:fixed;right:20px;top:20px;background:#000d;padding:12px 18px;border-radius:10px;z-index:9}.pulse{animation:pulse .45s}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.8)}}@media(max-width:500px){.card{width:calc(50% - 7px)}.card img{height:100px}}
</style></head><body><div class="wrap"><h1 class="logo">고아 카드 게임<small>GOA CARD GAME</small></h1><div id="home"><div class="menu"><button class="mainBtn" onclick="show('nickname')">닉네임 설정</button><button class="mainBtn" onclick="show('deck')">덱 편성</button><button class="mainBtn" id="match">매치메이킹</button></div><section id="nickname" class="panel"><h2>닉네임 설정</h2><div class="row"><input id="name" maxlength="20" placeholder="닉네임을 입력하세요"><span id="saveState" class="muted">입력하면 자동 저장됩니다.</span></div></section><section id="deck" class="panel"><h2>덱 편성 <small id="deckCount"></small></h2><p class="muted">최대 20장, 같은 카드는 최대 2장입니다. + / − 변경 즉시 자동 저장됩니다.</p><div id="catalog" class="cards"></div></section></div><main id="game" class="hidden"><h2 id="turn"></h2><h3>상대 필드</h3><div id="enemy" class="field"></div><h3>내 필드</h3><div id="mine" class="field"></div><h3>내 손패</h3><div id="hand" class="hand"></div></main></div><div id="toast" class="hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io(),pid=localStorage.goaPlayerId||(localStorage.goaPlayerId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,selected,saveTimer;const C=id=>cards.find(c=>c.id===id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id))}function skills(c){return (c.skills||[]).map(s=>`<p><b>${esc(s.name)}</b><br>${esc(s.description||'')}</p>`).join('')}function art(c){return `<img src="/${esc(c.image)}" alt="${esc(c.name)}" onerror="this.style.opacity=.25">`}
function renderCatalog(){deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable).slice(0,20);deckCount.textContent=`${deck.length}/20`;catalog.innerHTML=cards.filter(c=>!c.isUnobtainable).map(c=>{const n=deck.filter(id=>id===c.id).length;return `<article class="card">${n?`<i class="qty">${n}</i>`:''}${art(c)}<h3>${esc(c.name)}</h3><p><b>HP ${c.hp??'-'}</b> · ${esc(c.type)}</p>${skills(c)}<button onclick="change('${c.id}',1)">＋</button><button onclick="change('${c.id}',-1)">−</button></article>`}).join('')}
function change(id,d){const n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20)return note('덱은 최대 20장입니다.');if(n>=2)return note('같은 카드는 최대 2장입니다.');deck.push(id)}else{const i=deck.lastIndexOf(id);if(i<0)return;deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderCatalog();autoSave()}
async function save(){const name=$('#name').value.trim();if(!name){saveState.textContent='닉네임을 입력하세요.';return false}localStorage.goaName=name;localStorage.goaDeck=JSON.stringify(deck);saveState.textContent='저장 중...';const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name,deck})});saveState.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}name.addEventListener('input',autoSave);
function note(t){toast.textContent=t;toast.classList.remove('hidden');toast.classList.add('pulse');setTimeout(()=>{toast.classList.add('hidden');toast.classList.remove('pulse')},1600)}
Promise.all([fetch('/api/cards').then(r=>r.json()),fetch('/api/profile/'+pid).then(r=>r.json())]).then(([cs,p])=>{cards=cs;if(p){name.value=p.name;deck=p.deck}else name.value=localStorage.goaName||'';renderCatalog()});match.onclick=async()=>{if(!deck.length)return note('덱에 카드를 1장 이상 넣어 주세요.');if(await save()){socket.emit('matchmake',pid);note('상대를 찾는 중...')}};
function unit(m,own){const c=C(m.id);return `<article class="card ${selected===m.uid?'selected':''}" onclick="selectUnit('${m.uid}')">${art(c)}<h3>${esc(c.name)}</h3><p><b>HP ${m.hp}/${m.maxHp}</b></p>${skills(c)}<p>${m.status.map(x=>esc(x.type)+' '+x.duration+'턴').join(', ')}</p>${own?(c.skills||[]).map((s,i)=>`<button onclick="event.stopPropagation();useSkill('${m.uid}',${i})">${esc(s.name)}</button>`).join(''):''}</article>`}
function renderGame(){const me=state.players[state.you],op=state.players[1-state.you];turn.textContent=state.ended?`게임 종료 · 승자: ${state.winner}`:state.turn===state.you?'내 턴':'상대 턴';mine.innerHTML=me.field.map(x=>unit(x,true)).join('')||'<p>비어 있음</p>';enemy.innerHTML=op.field.map(x=>unit(x,false)).join('')||'<p>비어 있음</p>';hand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="card">${art(c)}<h3>${esc(c.name)}</h3><p><b>HP ${c.hp??'-'}</b></p>${skills(c)}<button onclick="play('${id}')">사용</button></article>`}).join('')||'<p>손패 없음</p>'}function selectUnit(uid){selected=uid;renderGame()}function play(id){const c=C(id),noTarget=['draw_monster','draw_random','confuse_all','cleanse_all','return_opponent_hand'].includes(c.skills?.[0]?.type);if(!c.hp&&!selected&&!noTarget)return note('효과 대상을 먼저 선택하세요.');socket.emit('action',{type:'play',cardId:id,targetUid:selected})}function useSkill(uid,i){const c=C(state.players[state.you].field.find(x=>x.uid===uid).id),sk=c.skills[i];if(!selected&&!['multi','heal','shield'].includes(sk.type))return note('공격 대상을 먼저 선택하세요.');socket.emit('action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:selected})}
socket.on('queue',note);socket.on('errorMsg',note);socket.on('effect',e=>note(e.text||e.type));socket.on('state',s=>{state=s;home.classList.add('hidden');game.classList.remove('hidden');selected=null;renderGame()});
</script></body></html>
