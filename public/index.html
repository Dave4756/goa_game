<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}html,body,button,.home,.battle,.board,.zone,.pile,.miniCard,.fieldCard,.handCard,.hud,.skillNames,.hp,.tag{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}body{margin:0;color:#fff;font-family:system-ui;background:#0e1422 url('/image/background.png') center/cover no-repeat fixed}.hidden{display:none!important}button{border:0;border-radius:10px;padding:10px 14px;background:#5577dc;color:#fff;font-weight:800;cursor:pointer}.home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:#0008}.home h1{font-size:clamp(40px,7vw,76px);margin:0 0 20px}.home>button{width:min(390px,84vw);height:64px;font-size:21px}.modal{position:fixed;inset:0;background:#050914ee;display:grid;place-items:center;padding:18px;z-index:50}.box{width:min(1180px,96vw);max-height:92vh;overflow:auto;background:#13203a;border:1px solid #7994ce;border-radius:18px;padding:18px}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.miniCard,.fieldCard{background:#253653;border:2px solid #6f88bb;border-radius:13px;padding:7px;position:relative;overflow:hidden}.miniCard img,.fieldCard img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}.miniCard h3,.fieldCard h3{height:36px;margin:5px 0;font-size:14px;overflow:hidden}.skillNames{height:34px;font-size:10px;overflow:hidden;color:#cfe0ff}.hp{font-variant-numeric:tabular-nums;display:inline-block;min-width:92px;text-align:center}.battle{min-height:100vh;padding:9px;background:linear-gradient(#d77788 0 49.5%,#94bdea 50.5%)}.rail{display:none}.pile{display:grid;place-items:center;text-align:center;white-space:pre-line;background:#111d35e8;border:2px solid #e8efff;border-radius:14px;cursor:pointer;position:relative;user-select:none}.pile.canDraw{border-color:#ffe259;box-shadow:0 0 18px #ffe259aa;animation:deckPulse 1.1s infinite}.pile.disabled{opacity:.55;cursor:not-allowed}@keyframes deckPulse{50%{transform:scale(1.035);filter:brightness(1.2)}}.board{max-width:1180px;min-height:calc(100vh - 18px);margin:auto;display:grid;grid-template-rows:86px 1fr 1fr 190px;gap:7px;min-width:0}.zone{border:2px dashed #ffffffaa;border-radius:14px;padding:7px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:84px}.fieldHalf{position:relative;display:grid;grid-template-rows:1fr;gap:6px;padding-left:112px}.fieldPiles{position:absolute;left:0;top:0;bottom:0;width:103px;display:grid;grid-template-rows:1fr 1fr;gap:7px}.fieldPiles.mine{left:auto;right:0}.fieldHalf.mineHalf{padding-left:0;padding-right:112px}.fieldCard{width:145px;height:230px;flex:0 0 auto;cursor:pointer}.fieldCard img{height:135px;aspect-ratio:auto}.fieldCard .equipCount{position:absolute;right:4px;top:4px;background:#ffd74a;color:#111;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}.selected{outline:5px solid #ffe134}.hand{position:relative;overflow:visible}.handCard{position:absolute;width:125px;height:182px;transform-origin:50% 125%;transition:transform .18s,filter .18s;cursor:grab}.handCard:hover{filter:brightness(1.18);z-index:20!important}.handCard img{height:112px;aspect-ratio:auto}.handCard h3{height:27px}.handCard .skillNames{height:24px}.hud{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;background:#071024dd;padding:8px;border-radius:13px}.turnFx{position:fixed;inset:0;display:grid;place-items:center;background:#0009;font-size:clamp(52px,11vw,120px);font-weight:1000;z-index:70;animation:turn 1.1s forwards}@keyframes turn{0%{opacity:0;transform:scale(.7)}25%,70%{opacity:1;transform:scale(1)}100%{opacity:0;visibility:hidden}}.fxCard{animation:cardFx .65s}@keyframes cardFx{35%{transform:translateY(-25px) scale(1.08);filter:brightness(1.7)}100%{transform:none}}.fxHit{animation:hit .5s}@keyframes hit{25%{transform:translateX(-12px);filter:brightness(2)}50%{transform:translateX(12px)}100%{transform:none}}.fxDraw{animation:draw .65s}@keyframes draw{0%{transform:translateY(-80px) rotate(-15deg);opacity:0}100%{transform:none;opacity:1}}.detail{display:grid;grid-template-columns:280px 1fr;gap:20px}.detail img{width:100%;max-height:430px;object-fit:contain}.skillBox{background:#1d2c4b;border:1px solid #7794cf;border-radius:12px;padding:12px;margin:9px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#334b78;border-radius:20px;padding:5px 9px;font-size:12px}.trashGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.dropReady{background:#75ff8c44!important;border-color:#8cff9c!important}.matchProgress{width:min(390px,84vw);display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;font-weight:800;color:#e7efff}.matchProgress.hidden{display:none!important}.spinner{width:20px;height:20px;border:3px solid #ffffff55;border-top-color:#ffe259;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#status{min-height:24px;text-align:center}@media(max-width:760px){.deckGrid,.detail{grid-template-columns:1fr}.battle{display:block}.fieldCard{width:110px;height:195px}.fieldCard img{height:105px}.board{grid-template-rows:70px 1fr 1fr 165px}.fieldHalf{padding-left:78px}.fieldHalf.mineHalf{padding-right:78px}.fieldPiles{width:71px;font-size:11px}.handCard{width:100px;height:155px}}
</style></head><body><main id="home" class="home"><h1>🔥고아 카드 게임🔥</h1><button id="nickBtn">닉네임 설정</button><button id="deckBtn">덱 편성</button><button id="matchBtn">매치메이킹</button><button id="botBtn">봇전</button><div id="matchProgress" class="matchProgress hidden"><span class="spinner"></span><span id="matchProgressText">매칭 서버 연결 확인 중...</span></div><div id="status"></div></main>
<section id="nickModal" class="modal hidden"><div class="box"><button data-close="nickModal">닫기</button><h2>닉네임</h2><input id="nickname" maxlength="20" style="width:100%;padding:14px;font-size:18px"><p id="saveText">입력하면 자동 저장됩니다.</p></div></section>
<section id="deckModal" class="modal hidden"><div class="box"><button data-close="deckModal">닫기</button><div class="deckGrid"><section><h2>전체 카드</h2><div id="allCards" class="cardGrid"></div></section><section><h2>내 덱 <span id="deckCount"></span></h2><div id="deckCards" class="cardGrid"></div></section></div></div></section>
<main id="battle" class="battle hidden"><section class="board"><div id="opHand" class="zone"></div><div class="fieldHalf"><aside class="fieldPiles"><div id="opDeck" class="pile">상대 덱</div><div id="opTrash" class="pile">상대 트레쉬</div></aside><div id="opField" class="zone"></div></div><div class="fieldHalf mineHalf"><aside class="fieldPiles mine"><div id="myDeck" class="pile" title="내 턴에 클릭하여 1장 드로우">내 덱</div><div id="myTrash" class="pile">내 트레쉬</div></aside><div id="myField" class="zone dropZone" data-zone="field"></div></div><div id="myHand" class="zone hand"></div></section></main>
<div id="hud" class="hud hidden"><button id="skipBtn">턴 스킵</button></div><div id="turnFx" class="turnFx hidden"></div>
<section id="detailModal" class="modal hidden"><div id="detailBox" class="box"></div></section><section id="trashModal" class="modal hidden"><div class="box"><button data-close="trashModal">닫기</button><h2 id="trashTitle"></h2><div id="trashCards" class="trashGrid"></div></div></section>
<script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io({transports:['polling','websocket'],timeout:10000}),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,targetUid=null,saveTimer,lastTurn=-1,dragging=false,matching=false,matchStartedAt=0,matchClock=null;const C=id=>cards.find(c=>c.id===id),isMonster=c=>c?.hp!=null,open=id=>$('#'+id).classList.remove('hidden'),close=id=>$('#'+id).classList.add('hidden');
function compact(c){return `<img loading="lazy" decoding="async" src="/${c.image}"><h3>${c.name}</h3>${isMonster(c)?`<b class="hp">HP ${String(c.hp).padStart(3,'0')}</b>`:''}<div class="skillNames">${(c.skills||[]).map(s=>s.name).join(' / ')}</div>`}function full(c,u){return `<div class="detail"><div><img src="/${c.image}"><h2>${c.name}</h2>${u?`<p>현재 HP <b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b></p>`:''}<div class="tags">${(u?.items||[]).map(id=>`<span class="tag">${C(id)?.name||id}</span>`).join('')||'<span class="tag">장착 없음</span>'}</div></div><div><h2>스킬 및 설명</h2>${(c.skills||[]).map((s,i)=>`<div class="skillBox"><h3>${s.name}</h3><p>${s.description||'설명 없음'}</p>${s.damage!=null?`<p>피해 ${s.damage}</p>`:''}${s.heal!=null?`<p>회복 ${s.heal}</p>`:''}${u&&state.players[state.you].field.some(x=>x.uid===u.uid)?`<button onclick="useSkill('${u.uid}',${i},'${s.type}')">스킬 사용</button>`:''}</div>`).join('')}</div></div>`}
function renderDeck(){const n={};deck.forEach(id=>n[id]=(n[id]||0)+1);allCards.innerHTML=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card').map(c=>`<article class="miniCard" onclick="showCatalogDetail('${c.id}')">${compact(c)}<button onclick="event.stopPropagation();changeDeck('${c.id}',1)">추가 ${n[c.id]||0}/2</button></article>`).join('');deckCards.innerHTML=Object.keys(n).map(C).filter(Boolean).map(c=>`<article class="miniCard" onclick="showCatalogDetail('${c.id}')">${compact(c)}<button onclick="event.stopPropagation();changeDeck('${c.id}',-1)">제거 ${n[c.id]}</button></article>`).join('')||'선택 없음';deckCount.textContent=`${deck.length}/20`}function changeDeck(id,d){const n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20||n>=2)return;deck.push(id)}else{const i=deck.lastIndexOf(id);if(i>=0)deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();queueSave()}
async function saveProfile(){const name=nickname.value.trim();localStorage.goaName=name;localStorage.goaDeck=JSON.stringify(deck);if(!name)return false;try{const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name,deck})});saveText.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}catch{return false}}function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveProfile,250)}nickname.oninput=queueSave;
async function boot(){const[cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();const p=pr.ok?await pr.json():null;if(p){nickname.value=p.name;deck=p.deck}else nickname.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card');renderDeck()}boot().catch(()=>status.textContent='카드 로드 실패');
function showCatalogDetail(id){const c=C(id);detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(c,null)}`;bindClose();open('detailModal')}function fieldCard(u,own){if(!u)return '';const c=C(u.id);return `<article id="unit-${u.uid}" class="fieldCard ${targetUid===u.uid?'selected':''}" data-uid="${u.uid}" ondragover="event.preventDefault()" ondrop="dropOnUnit(event,'${u.uid}')" onclick="showUnit('${u.uid}')">${compact(c)}<b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b><span class="equipCount">${u.items.length}</span></article>`}function fan(){const els=[...myHand.children],mid=(els.length-1)/2;els.forEach((el,i)=>{const d=i-mid;el.style.left=`calc(50% - 62px + ${d*66}px)`;el.style.transform=`rotate(${d*6}deg) translateY(${Math.abs(d)*5}px)`;el.style.zIndex=i})}
function render(){const me=state.players[state.you],op=state.players[1-state.you],mine=state.turn===state.you&&!state.ended;opHand.textContent=`상대 패 ${op.handCount}장`;opField.innerHTML=op.field.map(u=>fieldCard(u,false)).join('')||'상대 필드 비어 있음';myField.innerHTML=me.field.map(u=>fieldCard(u,true)).join('')||'내 필드 비어 있음';myHand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="miniCard handCard" draggable="${mine}" data-id="${id}" ondragstart="startDrag(event,'${id}')" ondragend="endDrag()" onclick="if(!dragging)showHand('${id}')">${compact(c)}</article>`}).join('')||'내 패 없음';fan();opDeck.textContent=`상대 덱\n${op.deckCount}장`;opTrash.textContent=`상대 트레쉬\n${op.trash.length}장`;myDeck.textContent=`내 덱\n${me.deckCount}장`;myTrash.textContent=`내 트레쉬\n${me.trash.length}장`;myDeck.classList.toggle('canDraw',mine&&!me.drawn&&me.deckCount>0);myDeck.classList.toggle('disabled',!mine||me.drawn||me.deckCount===0);skipBtn.disabled=!mine;hud.classList.toggle('hidden',state.ended);if(lastTurn!==state.turn){lastTurn=state.turn;showTurn(mine?'내 턴':'상대 턴')}}function startDrag(e,id){dragging=true;e.dataTransfer.setData('cardId',id);e.dataTransfer.effectAllowed='move';document.querySelectorAll('.dropZone,.fieldCard').forEach(x=>x.classList.add('dropReady'))}function endDrag(){setTimeout(()=>dragging=false,0);document.querySelectorAll('.dropReady').forEach(x=>x.classList.remove('dropReady'))}function dropZone(e,zone){e.preventDefault();const id=e.dataTransfer.getData('cardId'),c=C(id);if(isMonster(c))doAction({type:'play',cardId:id,zone:'field'});else status.textContent='아이템은 대상 몬스터 위에 드롭하세요.';endDrag()}function dropOnUnit(e,uid){e.preventDefault();e.stopPropagation();const id=e.dataTransfer.getData('cardId'),c=C(id);if(isMonster(c))return status.textContent='몬스터는 필드에 드롭하세요.';doAction({type:'play',cardId:id,targetUid:uid});endDrag()}document.querySelectorAll('.dropZone').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>dropZone(e,z.dataset.zone)});
function findUnit(uid){for(const p of state.players){const u=p.field.find(x=>x.uid===uid);if(u)return u}}function showUnit(uid){const u=findUnit(uid),c=C(u.id),mine=state.players[state.you].field.some(x=>x.uid===uid);if(!mine)targetUid=uid;detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(c,u)}`;bindClose();open('detailModal');render()}function showHand(id){detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(C(id),null)}<p>${isMonster(C(id))?'필드로 드래그하세요.':'대상 몬스터 위로 드래그하세요.'}</p>`;bindClose();open('detailModal')}function showTrash(ids,title){trashTitle.textContent=title;trashCards.innerHTML=ids.map(id=>`<article class="miniCard">${compact(C(id))}</article>`).join('')||'비어 있음';open('trashModal')}
function useSkill(uid,i,type){const skillTarget=['heal','shield'].includes(type)?uid:targetUid;close('detailModal');doAction({type:'skill',sourceUid:uid,skillIndex:i,targetUid:skillTarget})}function doAction(a){socket.timeout(5000).emit('game:action',a,(err,res)=>{if(err)status.textContent='서버 응답 없음';else if(!res?.ok)status.textContent=res?.error||'행동 실패'})}myDeck.onclick=()=>{if(!state)return;if(state.ended)return;const me=state.players[state.you];if(state.turn!==state.you)return status.textContent='내 턴에만 드로우할 수 있습니다.';if(me.drawn)return status.textContent='이번 턴에는 이미 드로우했습니다.';if(!me.deckCount)return status.textContent='덱이 비었습니다.';doAction({type:'draw'})};skipBtn.onclick=()=>doAction({type:'skip'});
function showTurn(text){turnFx.textContent=text;turnFx.className='turnFx';void turnFx.offsetWidth;turnFx.className='turnFx'}function animate(e){if(e.kind==='draw'){const el=myHand.lastElementChild;el?.classList.add('fxDraw')}if(e.kind==='summon'||e.kind==='item'||e.kind==='equip'){const el=e.targetUid?$('#unit-'+e.targetUid):null;el?.classList.add('fxCard')}if(e.kind==='skill')(e.targetUids||[]).forEach(id=>$('#unit-'+id)?.classList.add('fxHit'));status.textContent=e.text||''}
function setMatchProgress(on,text=''){matching=on;matchProgress.classList.toggle('hidden',!on);matchProgressText.textContent=text;if(on){matchBtn.textContent='매칭 취소';matchStartedAt=Date.now();clearInterval(matchClock);matchClock=setInterval(()=>{const sec=Math.floor((Date.now()-matchStartedAt)/1000);matchProgressText.textContent=`상대를 찾는 중... ${sec}초`},1000)}else{clearInterval(matchClock);matchClock=null;matchBtn.textContent='매치메이킹'}}function cancelMatch(){socket.emit('match:cancel');setMatchProgress(false);status.textContent='매칭을 취소했습니다.'}function setConnectionText(text){if(!matching)status.textContent=text}async function ready(){if(!socket.connected){status.textContent='서버 연결 중';socket.connect();return false}if(!nickname.value.trim()||!deck.some(id=>C(id)?.hp!=null)){status.textContent='닉네임과 몬스터 포함 덱이 필요합니다.';return false}return saveProfile()}matchBtn.onclick=async()=>{if(matching)return cancelMatch();status.textContent='매칭 서버 연결 확인 중...';if(!await ready())return;setMatchProgress(true,'매칭 요청 전송 중...');socket.timeout(5000).emit('match:join',pid,(e,r)=>{if(e){setMatchProgress(false);status.textContent='매칭 서버 응답 없음. 잠시 후 다시 눌러 주세요.'}else if(!r?.ok){setMatchProgress(false);status.textContent=r?.error||'매칭 요청 실패'}else{status.textContent='매칭 대기열에 등록되었습니다.'}})};botBtn.onclick=async()=>{if(matching)cancelMatch();status.textContent='봇전 준비 중...';if(await ready())socket.timeout(5000).emit('bot:start',pid,(e,r)=>status.textContent=e?'봇전 서버 응답 없음':r?.ok?'봇전 시작 중...':r?.error)};nickBtn.onclick=()=>open('nickModal');deckBtn.onclick=()=>{renderDeck();open('deckModal')};opTrash.onclick=()=>state&&showTrash(state.players[1-state.you].trash,'상대 트레쉬');myTrash.onclick=()=>state&&showTrash(state.players[state.you].trash,'내 트레쉬');function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close))}bindClose();document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)close(m.id)});
socket.on('connect',()=>setConnectionText('멀티플레이 서버 연결됨'));socket.on('connect_error',()=>{setMatchProgress(false);status.textContent='멀티플레이 서버 연결 실패'});socket.on('disconnect',()=>{setMatchProgress(false);status.textContent='멀티플레이 서버 연결이 끊겼습니다.'});socket.on('match:waiting',t=>{if(!matching)setMatchProgress(true,t);status.textContent='매칭 대기열에 등록됨'});socket.on('match:cancelled',()=>{setMatchProgress(false);status.textContent='매칭을 취소했습니다.'});socket.on('game:state',s=>{setMatchProgress(false);state=s;home.classList.add('hidden');battle.classList.remove('hidden');hud.classList.remove('hidden');render()});socket.on('game:event',e=>setTimeout(()=>animate(e),40));
</script></body></html>
