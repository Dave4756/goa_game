<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div class="controls">
      <button id="btn-setup">1. 양측 몹 배치 완료</button>
    </div>

    <div id="player2-area" class="player-area">
      <div class="area-title">PLAYER 2 FIELD</div>
      <div id="field-p2" class="field drop-zone"></div>
    </div>

    <div id="player1-area" class="player-area">
      <div class="area-title">PLAYER 1 FIELD</div>
      <div id="field-p1" class="field drop-zone">
        <div id="card-inmyeon" class="card base-card">인면어</div>
      </div>
      
      <div class="area-title">PLAYER 1 HAND</div>
      <div id="hand-p1" class="hand">
        <div id="card-gyarados" class="card evo-card" draggable="true">갸라도스</div>
      </div>
    </div>
  </div>

  <div id="turn-banner" class="turn-banner hidden">
    <span id="turn-text"></span>
  </div>

  <div id="coin-modal" class="coin-modal hidden">
    <div class="coin" id="coin">
      <div class="coin-front">선공</div>
      <div class="coin-back">후공</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
