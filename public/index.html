<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui;background:#101828 url('/image/background.png') center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#0007;z-index:-1}.home{min-height:100vh;display:grid;place-content:center;gap:18px}.home button{width:min(360px,80vw);padding:20px;border:1px solid #b9cbff;border-radius:16px;background:#243e80e8;color:#fff;font-size:24px;font-weight:800;cursor:pointer}.home button:hover{background:#395cae}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:4}.box{width:min(1100px,96vw);max-height:90vh;overflow:auto;background:#111b31;border:1px solid #7894d7;border-radius:18px;padding:20px}.hidden{display:none!important}.cards,.field,.hand{display:flex;flex-wrap:wrap;gap:12px}.card{width:175px;background:#202d49;border:2px solid #536b99;border-radius:14px;padding:10px;position:relative}.card img{width:100%;height:120px;object-fit:cover;border-radius:9px}.card p{font-size:12px}.qty{position:absolute;right:5px;top:5px;background:#ffd04d;color:#111;border-radius:50%;padding:5px 9px}.x,.card button{border:0;border-radius:8px;padding:9px;margin:3px;background:#617fd5;color:white;cursor:pointer}input{padding:14px;font-size:18px;width:100%;border-radius:10px}.game{max-width:1100px;margin:auto;padding:20px;background:#08101dcc;min-height:100vh}.selected{outline:4px solid #ffd04d}#toast{position:fixed;top:16px;right:16px;background:#000e;padding:12px;z-index:8;border-radius:9px}@media(max-width:500px){.card{width:calc(50% - 6px)}}
</style></head><body><main id="home" class="home"><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deck')">덱 편성</button><button id="match">매치메이킹</button></main><section id="nick" class="modal hidden"><div class="box"><button class="x" onclick="closeM('nick')">닫기</button><h2>닉네임 설정</h2><input id="name" maxlength="20" placeholder="닉네임"><p id="saved">입력하면 자동 저장됩니다.</p></div></section><section id="deck" class="modal hidden"><div class="box"><button class="x" onclick="closeM('deck')">닫기</button><h2>덱 편성 <span id="count"></span></h2><p>최대 20장, 같은 카드 최대 2장. 변경 즉시 자동 저장됩니다.</p><div id="catalog" class="cards"></div></div></section><main id="game" class="game hidden"><h2 id="turn"></h2><h3>상대 필드</h3><div id="enemy" class="field"></div><h3>내 필드</h3><div id="mine" class="field"></div><h3>내 손패</h3><div id="hand" class="hand"></div></main><div id="toast" class="hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io(),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,sel,timer;const C=id=>cards.find(c=>c.id===id),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function openM(id){$('#'+id).classList.remove('hidden')}function closeM(id){$('#'+id).classList.add('hidden')}function art(c){return `<img src="/${e(c.image)}" alt="${e(c.name)}">`}function info(c){return `<h3>${e(c.name)}</h3><b>HP ${c.hp??'-'}</b>${(c.skills||[]).map(s=>`<p><b>${e(s.name)}</b><br>${e(s.description)}</p>`).join('')}`}
function renderDeck(){count.textContent=`${deck.length}/20`;catalog.innerHTML=cards.filter(c=>!c.isUnobtainable).map(c=>{let n=deck.filter(x=>x===c.id).length;return `<article class="card">${n?`<i class="qty">${n}</i>`:''}${art(c)}${info(c)}<button onclick="chg('${c.id}',1)">＋</button><button onclick="chg('${c.id}',-1)">−</button></article>`}).join('')}function msg(t){toast.textContent=t;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1600)}function chg(id,d){let n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20)return msg('최대 20장입니다.');if(n>=2)return msg('같은 카드는 2장까지입니다.');deck.push(id)}else{let i=deck.lastIndexOf(id);if(i<0)return;deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();autoSave()}
async function save(){let n=name.value.trim();if(!n)return false;localStorage.goaName=n;let r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name:n,deck})});saved.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}function autoSave(){clearTimeout(timer);timer=setTimeout(save,250)}name.oninput=autoSave;
Promise.all([fetch('/api/cards').then(r=>r.json()),fetch('/api/profile/'+pid).then(r=>r.json())]).then(([c,p])=>{cards=c;if(p){name.value=p.name;deck=p.deck}else name.value=localStorage.goaName||'';renderDeck()});match.onclick=async()=>{if(!name.value.trim()||!deck.length)return msg('닉네임과 덱을 먼저 설정하세요.');if(await save())socket.emit('matchmake',pid)};
function unit(m,own){let c=C(m.id);return `<article class="card ${sel===m.uid?'selected':''}" onclick="sel='${m.uid}';renderGame()">${art(c)}${info(c)}<b>현재 HP ${m.hp}/${m.maxHp}</b>${own?(c.skills||[]).map((s,i)=>`<button onclick="event.stopPropagation();skill('${m.uid}',${i})">${e(s.name)}</button>`).join(''):''}</article>`}function renderGame(){let me=state.players[state.you],op=state.players[1-state.you];turn.textContent=state.ended?`종료 · 승자 ${state.winner}`:state.turn===state.you?'내 턴':'상대 턴';mine.innerHTML=me.field.map(x=>unit(x,true)).join('');enemy.innerHTML=op.field.map(x=>unit(x,false)).join('');hand.innerHTML=me.hand.map(id=>{let c=C(id);return `<article class="card">${art(c)}${info(c)}<button onclick="play('${id}')">사용</button></article>`}).join('')}function play(id){socket.emit('action',{type:'play',cardId:id,targetUid:sel})}function skill(uid,i){socket.emit('action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:sel})}socket.on('queue',msg);socket.on('errorMsg',msg);socket.on('effect',x=>msg(x.text));socket.on('state',s=>{state=s;home.classList.add('hidden');game.classList.remove('hidden');sel=null;renderGame()});
</script></body></html>
