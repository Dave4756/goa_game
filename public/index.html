<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background-color:#111;background-image:url('/image/background.png');background-position:center;background-size:cover;background-repeat:no-repeat}.hidden{display:none!important}.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0007;transform:translateZ(0)}.home h1{font-size:clamp(40px,7vw,76px)}button{border:0;border-radius:9px;background:#5878d2;color:#fff;padding:10px;cursor:pointer}.home>button{width:380px;max-width:84vw;height:66px;font-size:22px}.modal{position:fixed;inset:0;background:#050811f2;display:grid;place-items:center;z-index:8;contain:strict}.box{width:min(1200px,96vw);max-height:92vh;overflow:auto;background:#14213b;padding:18px;border-radius:16px;contain:content}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.card{background:#253553;border:2px solid #7089bd;border-radius:11px;padding:7px;min-width:0}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px}.card h3{height:36px;margin:5px;font-size:14px}.desc{height:72px;overflow:auto;font-size:10px}.battle{min-height:100vh;display:grid;grid-template-columns:1fr 105px;gap:8px;padding:8px;background:linear-gradient(#df8191 0 50%,#b7d3f7 50%)}.board{display:grid;grid-template-rows:100px 1fr 1fr 205px;gap:6px}.zone{border:2px dashed #fff9;border-radius:12px;min-height:90px;padding:6px;display:flex;justify-content:center;align-items:center;gap:8px}.fieldBlock{display:grid;grid-template-rows:1fr 105px}.unit{width:145px;height:230px;background:#293854;border:2px solid #fff;border-radius:10px;padding:6px;position:relative}.unit img{width:100%;height:145px;object-fit:cover}.unit h3{height:32px;font-size:13px;margin:3px;overflow:hidden}.skillNames{height:34px;overflow:hidden;font-size:10px;line-height:1.25}.hp{display:inline-block;width:92px;font-variant-numeric:tabular-nums;text-align:center}.items{position:absolute;right:-8px;top:5px;font-size:10px}.hand{position:relative;overflow:visible}.handCard{position:absolute;width:130px;height:205px;transform-origin:50% 130%;transition:transform .2s;cursor:grab}.handCard img{width:100%;height:130px;object-fit:cover}.handCard h3{font-size:12px}.side{display:grid;grid-template-rows:1fr 1fr 1fr 1fr;gap:8px}.pile{display:grid;place-items:center;text-align:center;background:#13203ddd;border:2px solid #fff;border-radius:10px;white-space:pre-line;cursor:pointer}.selected{outline:4px solid #ffd500}.turnFx{position:fixed;inset:0;display:grid;place-items:center;background:#0008;font-size:clamp(50px,11vw,120px);font-weight:900;z-index:20;animation:fade 1.2s forwards}@keyframes fade{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;visibility:hidden}}input{width:100%;padding:14px;font-size:18px}.detail{display:grid;grid-template-columns:280px 1fr;gap:18px}.detail img{width:100%;max-height:420px;object-fit:contain}.detailSkills{display:grid;gap:10px}.skillDetail{background:#1d2d4d;border:1px solid #7894d7;border-radius:10px;padding:12px}.skillDetail h3{margin:0 0 7px}.skillDetail p{margin:0;line-height:1.5}.targetMark{color:#ffe36e;font-weight:800}.trashGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}@media(max-width:750px){.deckGrid,.detail{grid-template-columns:1fr}.battle{grid-template-columns:1fr 72px}.unit{width:115px}.handCard{width:105px}}
</style></head><body><main id="home" class="home"><h1>🔥고아 카드 게임🔥</h1><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deckM')">덱 편성</button><button id="match">매치메이킹</button><button id="bot">봇전</button><b id="status"></b></main><section id="nick" class="modal hidden" onclick="if(event.target===this)closeM('nick')"><div class="box"><button onclick="closeM('nick')">닫기</button><h2>닉네임</h2><input id="name"><p id="saved"></p></div></section><section id="deckM" class="modal hidden" onclick="if(event.target===this)closeM('deckM')"><div class="box"><button onclick="closeM('deckM')">닫기</button><div class="deckGrid"><div><h2>전체 카드</h2><div id="all" class="cards"></div></div><div><h2>내 덱 <span id="cnt"></span></h2><div id="picked" class="cards"></div></div></div></div></section>
<main id="battle" class="battle hidden"><section class="board"><div id="opHand" class="zone"></div><div class="fieldBlock"><div id="opActive" class="zone"></div><div id="opBench" class="zone"></div></div><div class="fieldBlock"><div id="myActive" class="zone drop" data-zone="active"></div><div id="myBench" class="zone drop" data-zone="bench"></div></div><div id="myHand" class="zone hand"></div></section><aside class="side"><div id="opDeck" class="pile"></div><div id="opTrash" class="pile"></div><div id="myTrash" class="pile"></div><div id="myDeck" class="pile"></div></aside></main><div id="turnFx" class="turnFx hidden"></div><section id="detailM" class="modal hidden" onclick="if(event.target===this)closeM('detailM')"><div id="detailBox" class="box"></div></section><section id="trashM" class="modal hidden" onclick="if(event.target===this)closeM('trashM')"><div class="box"><button onclick="closeM('trashM')">닫기</button><h2 id="trashTitle"></h2><div id="trashCards" class="trashGrid"></div></div></section><div id="toast" class="hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io({transports:['polling','websocket'],timeout:10000}),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());const nameEl=$('#name'),statusEl=$('#status'),savedEl=$('#saved'),matchEl=$('#match'),botEl=$('#bot'),homeEl=$('#home'),battleEl=$('#battle');let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,sel,timer,lastTurn=-1,deckRendered=false;const C=id=>cards.find(c=>c.id===id);function openM(id){$('#'+id).classList.remove('hidden');if(id==='deckM'&&!deckRendered){renderDeck();deckRendered=true}}function closeM(id){$('#'+id).classList.add('hidden')}function compactInfo(c){return `<img loading="lazy" decoding="async" src="/${c.image}"><h3>${c.name}</h3>${c.hp!=null?`<b class="hp">HP ${String(c.hp).padStart(3,'0')}</b>`:''}<div class="skillNames">${(c.skills||[]).map(s=>s.name).join(' / ')}</div>`}function fullInfo(c){return `<img loading="lazy" decoding="async" src="/${c.image}"><h2>${c.name}</h2>${c.hp!=null?`<b class="hp">HP ${String(c.hp).padStart(3,'0')}</b>`:''}<div class="detailSkills">${(c.skills||[]).map(s=>`<section class="skillDetail"><h3>${s.name}</h3><p>${s.description||'설명 없음'}</p>${s.damage!=null?`<p>피해: ${s.damage}</p>`:''}${s.heal!=null?`<p>회복: ${s.heal}</p>`:''}</section>`).join('')}</div>`}function cardInfo(c){return compactInfo(c)}function renderDeck(){let n={};deck.forEach(id=>n[id]=(n[id]||0)+1);const usable=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card');all.innerHTML=usable.map(c=>`<div class="card">${cardInfo(c)}<button onclick="chg('${c.id}',1)">추가 ${n[c.id]||0}/2</button></div>`).join('');picked.innerHTML=Object.keys(n).map(C).map(c=>`<div class="card">${cardInfo(c)}<button onclick="chg('${c.id}',-1)">제거 ${n[c.id]}</button></div>`).join('');cnt.textContent=deck.length+'/20'}function chg(id,d){let n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20||n>=2)return;deck.push(id)}else{let i=deck.lastIndexOf(id);if(i>=0)deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);if(!deckM.classList.contains('hidden'))renderDeck();autoSave()}async function save(){localStorage.goaName=nameEl.value.trim();if(!nameEl.value.trim())return false;let r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name:nameEl.value.trim(),deck})});savedEl.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}function autoSave(){clearTimeout(timer);timer=setTimeout(save,250)}nameEl.oninput=autoSave;
(async()=>{let[cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();let p=pr.ok?await pr.json():null;if(p){nameEl.value=p.name;deck=p.deck}else nameEl.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card')})();async function ready(){if(!socket.connected){statusEl.textContent='서버 연결 중입니다.';socket.connect();return false}if(!nameEl.value.trim()||!deck.some(id=>C(id)?.hp)){statusEl.textContent='닉네임과 몬스터 포함 덱이 필요합니다.';return false}return save()}matchEl.onclick=async()=>{statusEl.textContent='매칭 요청 준비 중...';if(!await ready())return;statusEl.textContent='상대를 찾는 중...';socket.timeout(5000).emit('match:join',pid,(err,res)=>{if(err)statusEl.textContent='매칭 서버 응답 없음. Render Web Service와 배포 로그를 확인하세요.';else if(!res?.ok)statusEl.textContent=res?.error||'매칭 요청 실패';else statusEl.textContent='상대를 찾는 중...'})};botEl.onclick=async()=>{statusEl.textContent='봇전 준비 중...';if(!await ready())return;socket.timeout(5000).emit('bot:start',pid,(err,res)=>{if(err)statusEl.textContent='봇전 서버 응답 없음. Render 배포 상태를 확인하세요.';else if(!res?.ok)statusEl.textContent=res?.error||'봇전 시작 실패';else statusEl.textContent='봇전 시작 중...'})};
function unit(u,own,active){if(!u)return '비어 있음';let c=C(u.id);return `<article class="unit ${sel===u.uid?'selected':''}" ondragover="event.preventDefault()" ondrop="dropCard(event,null,'${u.uid}')" onclick="showDetail('${u.uid}',${own},${active})">${compactInfo(c)}<b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b><span class="items">장착 ${u.items.length}</span></article>`}function fan(){let els=[...myHand.children],mid=(els.length-1)/2;els.forEach((e,i)=>{let d=i-mid;e.style.left=`calc(50% - 65px + ${d*72}px)`;e.style.transform=`rotate(${d*7}deg) translateY(${Math.abs(d)*5}px)`;e.style.zIndex=i})}function render(){let me=state.players[state.you],op=state.players[1-state.you];opHand.innerHTML=`상대 패 ${op.handCount}장`;opActive.innerHTML=unit(op.active,false,true);opBench.innerHTML=op.bench.map(u=>unit(u,false,false)).join('')||'상대 벤치';myActive.innerHTML=unit(me.active,true,true);myBench.innerHTML=me.bench.map(u=>unit(u,true,false)).join('')||'내 벤치';myHand.innerHTML=me.hand.map(id=>{let c=C(id);return `<article class="card handCard" draggable="true" data-id="${id}" ondragstart="event.dataTransfer.setData('cardId','${id}')" onclick="showHandDetail('${id}')">${compactInfo(c)}</article>`}).join('');fan();opDeck.textContent=`상대 덱\n${op.deckCount}장`;myDeck.textContent=`내 덱\n${me.deckCount}장`;opTrash.textContent=`상대 트레쉬\n${op.trash.length}장`;myTrash.textContent=`내 트레쉬\n${me.trash.length}장`;opTrash.onclick=()=>trash(op.trash,'상대 트레쉬');myTrash.onclick=()=>trash(me.trash,'내 트레쉬');if(lastTurn!==state.turn){lastTurn=state.turn;turnFx.textContent=state.turn===state.you?'내 턴':'상대 턴';turnFx.classList.remove('hidden');turnFx.classList.remove('turnFx');void turnFx.offsetWidth;turnFx.classList.add('turnFx')}}
function trash(ids,title){trashTitle.textContent=title;trashCards.innerHTML=ids.map(id=>`<div class="card">${cardInfo(C(id))}</div>`).join('')||'비어 있음';openM('trashM')}function showDetail(uid,own,active){let p=state.players.find(p=>p.active?.uid===uid||p.bench.some(x=>x.uid===uid)),u=p.active?.uid===uid?p.active:p.bench.find(x=>x.uid===uid),c=C(u.id);if(!own)sel=uid;const skills=(c.skills||[]).map((s,i)=>`<section class="skillDetail"><h3>${s.name}</h3><p>${s.description||'설명 없음'}</p>${s.damage!=null?`<p>피해: ${s.damage}</p>`:''}${s.heal!=null?`<p>회복: ${s.heal}</p>`:''}${own&&active?`<button onclick="attack('${uid}',${i})">${s.name} 사용</button>`:''}</section>`).join('');detailBox.innerHTML=`<button onclick="closeM('detailM')">닫기</button><div class="detail"><div><img src="/${c.image}" alt="${c.name}"><h2>${c.name}</h2><p>현재 HP <b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b></p><p>장착: ${u.items.map(id=>C(id)?.name).join(', ')||'없음'}</p>${!own?'<p class="targetMark">공격 대상으로 선택됨</p>':''}</div><div><h2>스킬 상세</h2><div class="detailSkills">${skills}</div></div></div>`;openM('detailM');render()}function attack(uid,i){const skill=C(state.players[state.you].active.id).skills[i];if(!sel&&!['heal','shield','multi'].includes(skill.type)){status.textContent='먼저 상대 카드를 선택하세요.';return}socket.emit('game:action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:sel});closeM('detailM')}
function showHandDetail(id){const c=C(id);detailBox.innerHTML=`<button onclick="closeM('detailM')">닫기</button><div class="detail"><div>${fullInfo(c)}</div><div><h2>사용 방법</h2><p>${c.hp!=null?'내 배틀 필드 또는 벤치로 드래그하세요.':'사용할 필드 카드 위로 직접 드래그하세요.'}</p></div></div>`;openM('detailM')}function dropCard(e,zone,targetUid){e.preventDefault();e.stopPropagation();const id=e.dataTransfer.getData('cardId'),c=C(id);if(!c)return;if(c.hp!=null){if(zone)socket.emit('game:action',{type:'play',cardId:id,zone})}else{if(!targetUid){statusEl.textContent='아이템을 대상 카드 위에 드롭하세요.';return}socket.emit('game:action',{type:'play',cardId:id,targetUid})}}document.querySelectorAll('.drop').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>dropCard(e,z.dataset.zone,null)});socket.on('connect',()=>statusEl.textContent='멀티플레이 서버 연결됨');socket.on('connect_error',e=>statusEl.textContent='서버 연결 실패: '+e.message);socket.on('disconnect',()=>statusEl.textContent='서버 연결 끊김');socket.on('match:waiting',t=>statusEl.textContent=t);socket.on('app:error',t=>statusEl.textContent=t);socket.on('game:state',s=>{state=s;homeEl.classList.add('hidden');battleEl.classList.remove('hidden');render()});socket.on('game:effect',x=>statusEl.textContent=x.text);
</script></body></html>
