<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0;min-height:100vh;color:white;font-family:system-ui;background:#101828 url('/image/background.png') center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#0008;z-index:-1}.home{min-height:100vh;display:grid;place-content:center;gap:15px}.title{text-align:center;font-size:clamp(38px,7vw,76px);margin:0 0 22px;text-shadow:0 4px 15px #000}.home>button{width:min(390px,84vw);height:68px;border:1px solid #bed0ff;border-radius:16px;background:#253e80ed;color:white;font-size:23px;font-weight:800;cursor:pointer}.status{text-align:center;font-weight:800;min-height:24px}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px;z-index:5}.box{width:min(1250px,97vw);max-height:92vh;overflow:auto;background:#111b31;border:1px solid #7894d7;border-radius:18px;padding:18px}.hidden{display:none!important}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.column{background:#091225;padding:14px;border-radius:14px;min-width:0}.cards,.field,.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:start}.card{min-width:0;contain:layout paint;background:#202d49;border:2px solid #536b99;border-radius:14px;padding:9px;position:relative}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px}.card h3{height:38px;overflow:hidden;margin:7px 0;font-size:15px}.desc{height:82px;overflow:auto;font-size:11px}.qty{position:absolute;right:5px;top:5px;background:#ffd04d;color:#111;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}.btn,.card button{height:38px;border:0;border-radius:8px;padding:0 10px;margin:3px;background:#617fd5;color:white;cursor:pointer}.card button{width:calc(100% - 6px)}input{padding:14px;font-size:18px;width:100%;border-radius:10px}.game{max-width:1150px;margin:auto;padding:20px;background:#08101ddd;min-height:100vh}.selected{outline:4px solid #ffd04d}#toast{position:fixed;top:16px;right:16px;background:#000e;padding:13px;z-index:8;border-radius:9px}@media(max-width:800px){.deckGrid{grid-template-columns:1fr}.cards,.field,.hand{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main id="home" class="home"><h1 class="title">🔥고아 카드 게임🔥</h1><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deckModal')">덱 편성</button><button id="matchButton">매치메이킹</button><button id="botButton">봇전</button><div id="status" class="status"></div></main>
<section id="nick" class="modal hidden" onclick="if(event.target===this)closeM('nick')"><div class="box" onclick="event.stopPropagation()"><button class="btn" onclick="closeM('nick')">닫기</button><h2>닉네임 설정</h2><input id="nameInput" maxlength="20"><p id="saveState">입력하면 자동 저장됩니다.</p></div></section>
<section id="deckModal" class="modal hidden" onclick="if(event.target===this)closeM('deckModal')"><div class="box" onclick="event.stopPropagation()"><button class="btn" onclick="closeM('deckModal')">닫기</button><div class="deckGrid"><section class="column"><h2>편성 가능한 카드</h2><div id="available" class="cards"></div></section><section class="column"><h2>선택한 덱 <span id="deckCount"></span></h2><div id="selectedDeck" class="cards"></div></section></div></div></section>
<main id="game" class="game hidden"><h2 id="turnText"></h2><h3>상대 필드</h3><div id="enemy" class="field"></div><h3>내 필드</h3><div id="mine" class="field"></div><h3>내 손패</h3><div id="hand" class="hand"></div></main><div id="toast" class="hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io({transports:['websocket','polling']}),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,selected,timer,matching=false;const C=id=>cards.find(c=>c.id===id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function openM(id){$('#'+id).classList.remove('hidden')}function closeM(id){$('#'+id).classList.add('hidden')}function art(c){return `<img loading="lazy" src="/${esc(c.image)}">`}function info(c){return `<h3>${esc(c.name)}</h3><b>HP ${c.hp??'-'}</b><div class="desc">${(c.skills||[]).map(s=>`<p><b>${esc(s.name)}</b><br>${esc(s.description||'')}</p>`).join('')}</div>`}function card(c,add,n){return `<article class="card">${n?`<i class="qty">${n}</i>`:''}${art(c)}${info(c)}<button onclick="change('${c.id}',${add?1:-1})">${add?'덱에 추가':'덱에서 제거'}</button></article>`}
function renderDeck(){const counts={};deck.forEach(id=>counts[id]=(counts[id]||0)+1);const usable=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card');available.innerHTML=usable.map(c=>card(c,true,counts[c.id]||0)).join('')||'<p>카드 없음</p>';selectedDeck.innerHTML=Object.keys(counts).map(C).filter(Boolean).map(c=>card(c,false,counts[c.id])).join('')||'<p>선택한 카드 없음</p>';deckCount.textContent=`${deck.length}/20`}
function notice(t){toast.textContent=t;toast.classList.remove('hidden');clearTimeout(notice.t);notice.t=setTimeout(()=>toast.classList.add('hidden'),1800)}function change(id,d){const n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20)return notice('최대 20장입니다.');if(n>=2)return notice('같은 카드는 2장까지입니다.');deck.push(id)}else{const i=deck.lastIndexOf(id);if(i<0)return;deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();autoSave()}
async function saveProfile(){const name=nameInput.value.trim();localStorage.goaName=name;localStorage.goaDeck=JSON.stringify(deck);if(!name)return false;try{const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name,deck})});saveState.textContent=r.ok?'자동 저장됨':'브라우저에 저장됨';return r.ok}catch{saveState.textContent='브라우저에 저장됨';return false}}function autoSave(){localStorage.goaName=nameInput.value.trim();clearTimeout(timer);timer=setTimeout(saveProfile,250)}nameInput.oninput=autoSave;
(async()=>{try{const [cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();const p=pr.ok?await pr.json():null;if(p){nameInput.value=p.name;deck=p.deck}else nameInput.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card').slice(0,20);renderDeck();autoSave()}catch{notice('카드 로드 실패')}})();
async function ready(){if(!socket.connected){notice('멀티플레이 서버 연결 중입니다. 다시 눌러 주세요.');return false}if(!nameInput.value.trim()||!deck.length){notice('닉네임과 덱을 먼저 설정하세요.');return false}return await saveProfile()}matchButton.onclick=async()=>{if(matching){socket.emit('match:cancel');return}status.textContent='프로필 확인 중...';if(!await ready()){status.textContent='';return}matching=true;matchButton.textContent='매칭 취소';status.textContent='상대를 찾는 중...';socket.emit('match:join',pid)};botButton.onclick=async()=>{status.textContent='봇전 준비 중...';if(await ready())socket.emit('bot:start',pid);else status.textContent=''};
function unit(m,own){const c=C(m.id);return `<article class="card ${selected===m.uid?'selected':''}" onclick="selected='${m.uid}';renderGame()">${art(c)}${info(c)}<b>현재 HP ${m.hp}/${m.maxHp}</b>${own?(c.skills||[]).map((s,i)=>`<button onclick="event.stopPropagation();skill('${m.uid}',${i})">${esc(s.name)}</button>`).join(''):''}</article>`}function renderGame(){const me=state.players[state.you],op=state.players[1-state.you];turnText.textContent=state.ended?`게임 종료 · 승자: ${state.winner}`:state.turn===state.you?'내 턴':'상대 턴';mine.innerHTML=me.field.map(x=>unit(x,true)).join('')||'<p>비어 있음</p>';enemy.innerHTML=op.field.map(x=>unit(x,false)).join('')||'<p>비어 있음</p>';hand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="card">${art(c)}${info(c)}<button onclick="socket.emit('game:action',{type:'play',cardId:'${id}'})">사용</button></article>`}).join('')||'<p>손패 없음</p>'}function skill(uid,i){socket.emit('game:action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:selected})}
socket.on('connect',()=>status.textContent='');socket.on('connect_error',()=>status.textContent='서버 연결 실패');socket.on('match:waiting',t=>status.textContent=t);socket.on('match:cancelled',()=>{matching=false;matchButton.textContent='매치메이킹';status.textContent='매칭 취소됨'});socket.on('app:error',t=>{matching=false;matchButton.textContent='매치메이킹';status.textContent=t;notice(t)});socket.on('game:effect',x=>notice(x.text));socket.on('game:state',s=>{state=s;matching=false;home.classList.add('hidden');game.classList.remove('hidden');selected=null;renderGame()});
</script></body></html>
