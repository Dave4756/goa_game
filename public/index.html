<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:#111 url('/image/background.png') center/cover fixed}.hidden{display:none!important}.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0007}.home h1{font-size:clamp(40px,7vw,76px)}button{border:0;border-radius:9px;background:#5878d2;color:#fff;padding:10px;cursor:pointer}.home>button{width:380px;max-width:84vw;height:66px;font-size:22px}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(7px);display:grid;place-items:center;z-index:8}.box{width:min(1200px,96vw);max-height:92vh;overflow:auto;background:#14213b;padding:18px;border-radius:16px}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.card{background:#253553;border:2px solid #7089bd;border-radius:11px;padding:7px;min-width:0}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px}.card h3{height:36px;margin:5px;font-size:14px}.desc{height:72px;overflow:auto;font-size:10px}.battle{min-height:100vh;display:grid;grid-template-columns:1fr 105px;gap:8px;padding:8px;background:linear-gradient(#df8191 0 50%,#b7d3f7 50%)}.board{display:grid;grid-template-rows:100px 1fr 1fr 170px;gap:6px}.zone{border:2px dashed #fff9;border-radius:12px;min-height:90px;padding:6px;display:flex;justify-content:center;align-items:center;gap:8px}.fieldBlock{display:grid;grid-template-rows:1fr 105px}.unit{width:145px;height:190px;background:#293854;border:2px solid #fff;border-radius:10px;padding:6px;position:relative}.unit img{width:100%;height:95px;object-fit:cover}.unit h3{height:32px;font-size:13px;margin:3px;overflow:hidden}.hp{display:inline-block;width:92px;font-variant-numeric:tabular-nums;text-align:center}.items{position:absolute;right:-8px;top:5px;font-size:10px}.hand{position:relative;overflow:visible}.handCard{position:absolute;width:130px;height:170px;transform-origin:50% 130%;transition:transform .2s;cursor:grab}.handCard img{width:100%;height:95px;object-fit:cover}.handCard h3{font-size:12px}.side{display:grid;grid-template-rows:1fr 1fr 1fr 1fr;gap:8px}.pile{display:grid;place-items:center;text-align:center;background:#13203ddd;border:2px solid #fff;border-radius:10px;white-space:pre-line;cursor:pointer}.selected{outline:4px solid #ffd500}.turnFx{position:fixed;inset:0;display:grid;place-items:center;background:#0008;font-size:clamp(50px,11vw,120px);font-weight:900;z-index:20;animation:fade 1.2s forwards}@keyframes fade{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;visibility:hidden}}input{width:100%;padding:14px;font-size:18px}.detail{display:grid;grid-template-columns:280px 1fr;gap:18px}.detail img{width:100%}.trashGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}@media(max-width:750px){.deckGrid,.detail{grid-template-columns:1fr}.battle{grid-template-columns:1fr 72px}.unit{width:115px}.handCard{width:105px}}
</style></head><body><main id="home" class="home"><h1>🔥고아 카드 게임🔥</h1><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deckM')">덱 편성</button><button id="match">매치메이킹</button><button id="bot">봇전</button><b id="status"></b></main><section id="nick" class="modal hidden" onclick="if(event.target===this)closeM('nick')"><div class="box"><button onclick="closeM('nick')">닫기</button><h2>닉네임</h2><input id="name"><p id="saved"></p></div></section><section id="deckM" class="modal hidden" onclick="if(event.target===this)closeM('deckM')"><div class="box"><button onclick="closeM('deckM')">닫기</button><div class="deckGrid"><div><h2>전체 카드</h2><div id="all" class="cards"></div></div><div><h2>내 덱 <span id="cnt"></span></h2><div id="picked" class="cards"></div></div></div></div></section>
<main id="battle" class="battle hidden"><section class="board"><div id="opHand" class="zone"></div><div class="fieldBlock"><div id="opActive" class="zone"></div><div id="opBench" class="zone"></div></div><div class="fieldBlock"><div id="myActive" class="zone drop" data-zone="active"></div><div id="myBench" class="zone drop" data-zone="bench"></div></div><div id="myHand" class="zone hand"></div></section><aside class="side"><div id="opDeck" class="pile"></div><div id="opTrash" class="pile"></div><div id="myTrash" class="pile"></div><div id="myDeck" class="pile"></div></aside></main><div id="turnFx" class="turnFx hidden"></div><section id="detailM" class="modal hidden" onclick="if(event.target===this)closeM('detailM')"><div id="detailBox" class="box"></div></section><section id="trashM" class="modal hidden" onclick="if(event.target===this)closeM('trashM')"><div class="box"><button onclick="closeM('trashM')">닫기</button><h2 id="trashTitle"></h2><div id="trashCards" class="trashGrid"></div></div></section><div id="toast" class="hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io(),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,sel,timer,lastTurn=-1;const C=id=>cards.find(c=>c.id===id);function openM(id){$('#'+id).classList.remove('hidden')}function closeM(id){$('#'+id).classList.add('hidden')}function cardInfo(c){return `<img src="/${c.image}"><h3>${c.name}</h3>${c.hp!=null?`<b class="hp">HP ${c.hp}</b>`:''}<div class="desc">${(c.skills||[]).map(s=>`<p><b>${s.name}</b><br>${s.description||''}</p>`).join('')}</div>`}function renderDeck(){let n={};deck.forEach(id=>n[id]=(n[id]||0)+1);const usable=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card');all.innerHTML=usable.map(c=>`<div class="card">${cardInfo(c)}<button onclick="chg('${c.id}',1)">추가 ${n[c.id]||0}/2</button></div>`).join('');picked.innerHTML=Object.keys(n).map(C).map(c=>`<div class="card">${cardInfo(c)}<button onclick="chg('${c.id}',-1)">제거 ${n[c.id]}</button></div>`).join('');cnt.textContent=deck.length+'/20'}function chg(id,d){let n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20||n>=2)return;deck.push(id)}else{let i=deck.lastIndexOf(id);if(i>=0)deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();autoSave()}async function save(){localStorage.goaName=name.value.trim();if(!name.value.trim())return false;let r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name:name.value.trim(),deck})});saved.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}function autoSave(){clearTimeout(timer);timer=setTimeout(save,250)}name.oninput=autoSave;
(async()=>{let[cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();let p=pr.ok?await pr.json():null;if(p){name.value=p.name;deck=p.deck}else name.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card');renderDeck()})();async function ready(){if(!name.value.trim()||!deck.some(id=>C(id)?.hp)){status.textContent='닉네임과 몬스터 포함 덱이 필요합니다.';return false}return save()}match.onclick=async()=>{if(await ready()){status.textContent='상대를 찾는 중...';socket.emit('match:join',pid)}};bot.onclick=async()=>{if(await ready())socket.emit('bot:start',pid)};
function unit(u,own,active){if(!u)return '비어 있음';let c=C(u.id);return `<article class="unit ${sel===u.uid?'selected':''}" onclick="showDetail('${u.uid}',${own},${active})">${cardInfo(c)}<b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b><span class="items">장착 ${u.items.length}</span></article>`}function fan(){let els=[...myHand.children],mid=(els.length-1)/2;els.forEach((e,i)=>{let d=i-mid;e.style.left=`calc(50% - 65px + ${d*72}px)`;e.style.transform=`rotate(${d*7}deg) translateY(${Math.abs(d)*5}px)`;e.style.zIndex=i})}function render(){let me=state.players[state.you],op=state.players[1-state.you];opHand.innerHTML=`상대 패 ${op.handCount}장`;opActive.innerHTML=unit(op.active,false,true);opBench.innerHTML=op.bench.map(u=>unit(u,false,false)).join('')||'상대 벤치';myActive.innerHTML=unit(me.active,true,true);myBench.innerHTML=me.bench.map(u=>unit(u,true,false)).join('')||'내 벤치';myHand.innerHTML=me.hand.map(id=>{let c=C(id);return `<article class="card handCard" draggable="true" data-id="${id}" ondragstart="event.dataTransfer.setData('cardId','${id}')">${cardInfo(c)}</article>`}).join('');fan();opDeck.textContent=`상대 덱\n${op.deckCount}장`;myDeck.textContent=`내 덱\n${me.deckCount}장`;opTrash.textContent=`상대 트레쉬\n${op.trash.length}장`;myTrash.textContent=`내 트레쉬\n${me.trash.length}장`;opTrash.onclick=()=>trash(op.trash,'상대 트레쉬');myTrash.onclick=()=>trash(me.trash,'내 트레쉬');if(lastTurn!==state.turn){lastTurn=state.turn;turnFx.textContent=state.turn===state.you?'내 턴':'상대 턴';turnFx.classList.remove('hidden');turnFx.classList.remove('turnFx');void turnFx.offsetWidth;turnFx.classList.add('turnFx')}}
function trash(ids,title){trashTitle.textContent=title;trashCards.innerHTML=ids.map(id=>`<div class="card">${cardInfo(C(id))}</div>`).join('')||'비어 있음';openM('trashM')}function showDetail(uid,own,active){let p=state.players.find(p=>p.active?.uid===uid||p.bench.some(x=>x.uid===uid)),u=p.active?.uid===uid?p.active:p.bench.find(x=>x.uid===uid),c=C(u.id);sel=uid;detailBox.innerHTML=`<button onclick="closeM('detailM')">닫기</button><div class="detail"><div>${cardInfo(c)}</div><div><h2>${c.name}</h2><p>현재 HP <b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b></p><p>장착: ${u.items.map(id=>C(id)?.name).join(', ')||'없음'}</p>${own&&active?(c.skills||[]).map((s,i)=>`<button onclick="attack('${uid}',${i})">${s.name}</button>`).join(''):''}</div></div>`;openM('detailM');render()}function attack(uid,i){socket.emit('game:action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:sel});closeM('detailM')}
document.querySelectorAll('.drop').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('cardId'),c=C(id);socket.emit('game:action',{type:'play',cardId:id,zone:c.hp?z.dataset.zone:null,targetUid:sel})}});socket.on('match:waiting',t=>status.textContent=t);socket.on('app:error',t=>status.textContent=t);socket.on('game:state',s=>{state=s;home.classList.add('hidden');battle.classList.remove('hidden');render()});socket.on('game:effect',x=>status.textContent=x.text);
</script></body></html>
