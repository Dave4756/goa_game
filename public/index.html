<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JSON Card Arena</title><style>body{margin:0;background:#101522;color:#eef;font:14px system-ui}header,#setup,#game{max-width:1100px;margin:auto;padding:16px}input,button,select{padding:9px;margin:4px;border:0;border-radius:8px}button{cursor:pointer;background:#6c7cff;color:white}.cards,.field,.hand{display:flex;gap:10px;flex-wrap:wrap}.card{width:140px;background:#212a40;border:1px solid #465273;border-radius:12px;padding:8px;transition:.25s}.card img{width:100%;height:100px;object-fit:cover;border-radius:8px}.mine{box-shadow:0 0 14px #73e}.fx{animation:pop .45s}@keyframes pop{50%{transform:scale(1.08);filter:brightness(1.8)}}small{color:#aab}#log{position:fixed;right:12px;top:12px;background:#000b;padding:10px;border-radius:8px}.hidden{display:none}</style></head><body><header><h1>JSON Card Arena</h1><span id="status">오프라인</span></header><section id="setup"><input id="name" placeholder="플레이어 이름"><button id="save">이름/덱 자동 저장</button><button id="match">매치메이킹</button><p>덱 카드 클릭으로 선택합니다. 획득 불가 카드는 제외됩니다.</p><div id="catalog" class="cards"></div></section><main id="game" class="hidden"><h2 id="turn"></h2><h3>상대 필드</h3><div id="enemy" class="field"></div><h3>내 필드</h3><div id="mine" class="field"></div><h3>내 손패</h3><div id="hand" class="hand"></div></main><div id="log"></div><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io(),pid=localStorage.pid||(localStorage.pid=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.deck||'[]'),state,me=0,selected;
fetch('/api/cards').then(r=>r.json()).then(x=>{cards=x;renderCatalog()});fetch('/api/profile/'+pid).then(r=>r.json()).then(p=>{if(p){name.value=p.name;deck=p.deck;localStorage.deck=JSON.stringify(deck);renderCatalog()}});
function C(id){return cards.find(x=>x.id===id)} function img(c){return `<img src="${c.image}" onerror="this.style.opacity=.15">`}
function renderCatalog(){catalog.innerHTML=cards.filter(c=>!c.isUnobtainable).map(c=>`<div class="card ${deck.includes(c.id)?'mine':''}" onclick="toggle('${c.id}')">${img(c)}<b>${c.name}</b><br><small>${c.type} ${c.hp?'HP '+c.hp:''}</small></div>`).join('')}
window.toggle=id=>{deck.includes(id)?deck=deck.filter(x=>x!==id):deck.length<20&&deck.push(id);localStorage.deck=JSON.stringify(deck);renderCatalog();saveProfile()};
function saveProfile(){if(!name.value.trim())return;fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name:name.value.trim(),deck})})}
save.onclick=saveProfile;name.onchange=saveProfile;match.onclick=()=>{saveProfile();socket.emit('matchmake',pid)};socket.on('queue',x=>status.textContent=x);socket.on('errorMsg',alert);socket.on('effect',e=>{log.textContent=e.text||e.type;log.className='fx';setTimeout(()=>log.className='',500)});
socket.on('state',s=>{state=s;setup.classList.add('hidden');game.classList.remove('hidden');me=s.players.findIndex(p=>p.name===name.value.trim());if(me<0)me=0;render()});
function unit(m,own){let c=C(m.id);return `<div class="card" onclick="pick('${m.uid}',${own})">${img(c)}<b>${c.name}</b><br>HP ${m.hp}/${m.maxHp}<br><small>${m.status.map(x=>x.type+':'+x.duration).join(' ')}</small>${own?c.skills.map((x,i)=>`<button onclick="event.stopPropagation();skill('${m.uid}',${i})">${x.name}</button>`).join(''):''}</div>`}
function render(){let a=state.players[me],b=state.players[1-me];turn.textContent=state.ended?`종료 · 승자 ${state.winner}`:state.turn===me?'내 턴':'상대 턴';mine.innerHTML=a.field.map(x=>unit(x,true)).join('');enemy.innerHTML=b.field.map(x=>unit(x,false)).join('');hand.innerHTML=a.hand.map(id=>{let c=C(id);return `<div class="card">${img(c)}<b>${c.name}</b><br><small>${c.skills?.[0]?.description||''}</small><button onclick="play('${id}')">사용</button></div>`}).join('')}
window.pick=(uid,own)=>selected={uid,own};window.play=id=>{let c=C(id),t=selected?.uid;let noTarget=['draw_monster','draw_random','confuse_all','cleanse_all','return_opponent_hand'].includes(c.skills?.[0]?.type);if(!c.hp&&!t&&!noTarget){alert('대상 카드를 먼저 클릭하세요.');return}socket.emit('action',{type:'play',cardId:id,targetUid:t})};window.skill=(uid,i)=>{let sk=C(state.players[me].field.find(x=>x.uid===uid).id).skills[i],t=selected?.uid;if(!t&&sk.type!=='multi'){alert('대상을 먼저 클릭하세요.');return}socket.emit('action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:t})};
</script></body></html>
