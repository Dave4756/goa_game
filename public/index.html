<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}html,body,button,.home,.battle,.board,.zone,.pile,.miniCard,.fieldCard,.handCard,.hud,.skillNames,.hp,.tag{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}body{margin:0;color:#fff;font-family:system-ui;background:#0e1422 url('/image/background.png') center/cover no-repeat fixed}.hidden{display:none!important}button{border:0;border-radius:10px;padding:10px 14px;background:#5577dc;color:#fff;font-weight:800;cursor:pointer}.home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:#0008}.home h1{font-size:clamp(40px,7vw,76px);margin:0 0 20px}.home>button{width:min(390px,84vw);height:64px;font-size:21px}.modal{position:fixed;inset:0;background:#050914ee;display:grid;place-items:center;padding:18px;z-index:50}.box{width:min(1180px,96vw);max-height:92vh;overflow:auto;background:#13203a;border:1px solid #7994ce;border-radius:18px;padding:18px}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.miniCard,.fieldCard{background:#253653;border:2px solid #6f88bb;border-radius:13px;padding:7px;position:relative;overflow:hidden;transition:transform .2s,filter .2s}.miniCard img,.fieldCard img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}.miniCard h3,.fieldCard h3{height:36px;margin:5px 0;font-size:14px;overflow:hidden}.skillNames{height:34px;font-size:10px;overflow:hidden;color:#cfe0ff}.hp{font-variant-numeric:tabular-nums;display:inline-block;min-width:92px;text-align:center}.battle{min-height:100vh;padding:9px;background:linear-gradient(#d77788 0 49.5%,#94bdea 50.5%)}.rail{display:none}.pile{display:grid;place-items:center;text-align:center;white-space:pre-line;background:#111d35e8;border:2px solid #e8efff;border-radius:14px;cursor:pointer;position:relative;user-select:none}.pile.canDraw{border-color:#ffe259;box-shadow:0 0 18px #ffe259aa;animation:deckPulse 1.1s infinite}.pile.disabled{opacity:.55;cursor:not-allowed}@keyframes deckPulse{50%{transform:scale(1.035);filter:brightness(1.2)}}.board{max-width:1180px;min-height:calc(100vh - 18px);margin:auto;display:grid;grid-template-rows:86px 1fr 1fr 190px;gap:7px;min-width:0}.zone{border:2px dashed #ffffffaa;border-radius:14px;padding:7px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:84px}.fieldHalf{position:relative;display:grid;grid-template-rows:1fr;gap:6px;padding-left:112px}.fieldPiles{position:absolute;left:0;top:0;bottom:0;width:103px;display:grid;grid-template-rows:1fr 1fr;gap:7px}.fieldPiles.mine{left:auto;right:0}.fieldHalf.mineHalf{padding-left:0;padding-right:112px}.fieldCard{width:145px;height:230px;flex:0 0 auto;cursor:pointer}.fieldCard img{height:135px;aspect-ratio:auto}.fieldCard .equipCount{position:absolute;right:4px;top:4px;background:#ffd74a;color:#111;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}.selected{outline:5px solid #ffe134}.hand{position:relative;overflow:visible}.handCard{position:absolute;width:125px;height:182px;transform-origin:50% 125%;transition:transform .18s,filter .18s;cursor:grab}.handCard:hover{filter:brightness(1.18);z-index:20!important}.handCard img{height:112px;aspect-ratio:auto}.handCard h3{height:27px}.handCard .skillNames{height:24px}.hud{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;background:#071024dd;padding:8px;border-radius:13px}.turnFx{position:fixed;inset:0;display:grid;place-items:center;background:#0009;font-size:clamp(52px,11vw,120px);font-weight:1000;z-index:70;animation:turn 1.1s forwards}@keyframes turn{0%{opacity:0;transform:scale(.7)}25%,70%{opacity:1;transform:scale(1)}100%{opacity:0;visibility:hidden}}.detail{display:grid;grid-template-columns:280px 1fr;gap:20px}.detail img{width:100%;max-height:430px;object-fit:contain}.skillBox{background:#1d2c4b;border:1px solid #7794cf;border-radius:12px;padding:12px;margin:9px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#334b78;border-radius:20px;padding:5px 9px;font-size:12px}.trashGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.dropReady{background:#75ff8c44!important;border-color:#8cff9c!important}.targetReady{animation:targetPulse .75s infinite;border-color:#ffe259!important;cursor:crosshair}@keyframes targetPulse{50%{box-shadow:0 0 22px #ffe259;transform:translateY(-4px)}}.targetPrompt{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:80;background:#8d1730ee;border:2px solid #ffd5dd;border-radius:14px;padding:12px 18px;font-size:20px;font-weight:900}.matchProgress{width:min(390px,84vw);display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;font-weight:800;color:#e7efff}.matchProgress.hidden{display:none!important}.spinner{width:20px;height:20px;border:3px solid #ffffff55;border-top-color:#ffe259;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#status{min-height:24px;text-align:center}

/* 전투 모션 & 아이템 이펙트 CSS */
.popText{position:fixed;font-size:28px;font-weight:1000;text-shadow:0 0 8px #000,0 0 16px #000;pointer-events:none;z-index:1000;animation:popUp 1.1s cubic-bezier(0.18,0.89,0.32,1.28) forwards}@keyframes popUp{0%{opacity:0;transform:translate(-50%,0) scale(0.5)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.3)}70%{opacity:1;transform:translate(-50%,-40px) scale(1)}100%{opacity:0;transform:translate(-50%,-65px) scale(0.8)}}
.itemBanner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;padding:12px 28px;border-radius:20px;color:#fff;z-index:900;pointer-events:none;animation:bannerAnim 1.2s ease-out forwards;box-shadow:0 0 30px rgba(255,255,255,0.6)}@keyframes bannerAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.4) rotate(-5deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(0deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(0.9)}}
.fxLungeMine{animation:lungeMine 0.45s cubic-bezier(0.25,1,0.5,1);z-index:35!important}@keyframes lungeMine{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-75px) scale(1.2)}100%{transform:translateY(0) scale(1)}}
.fxLungeOp{animation:lungeOp 0.45s cubic-bezier(0.25,1,0.5,1);z-index:35!important}@keyframes lungeOp{0%{transform:translateY(0) scale(1)}40%{transform:translateY(75px) scale(1.2)}100%{transform:translateY(0) scale(1)}}
.fxHitShake{animation:hitShake 0.45s ease-in-out}@keyframes hitShake{0%{transform:translate(0,0)}15%{transform:translate(-12px,-6px) rotate(-5deg);filter:brightness(2.2) sepia(1) hue-rotate(-50deg)}30%{transform:translate(12px,6px) rotate(5deg);filter:brightness(2.5) sepia(1) hue-rotate(-50deg)}45%{transform:translate(-8px,4px)}100%{transform:translate(0,0);filter:brightness(1)}}
.fxElectric{animation:electricFlash 0.5s ease-out}@keyframes electricFlash{30%{box-shadow:0 0 35px #ffee33,inset 0 0 25px #ffee33;filter:brightness(2)}100%{box-shadow:none;filter:brightness(1)}}
.fxWater{animation:waterFlash 0.5s ease-out}@keyframes waterFlash{30%{box-shadow:0 0 35px #38bdf8,inset 0 0 25px #38bdf8;filter:brightness(1.8)}100%{box-shadow:none;filter:brightness(1)}}
.fxHealGlow{animation:healGlow 0.6s ease-out}@keyframes healGlow{40%{transform:scale(1.1);filter:brightness(1.8) drop-shadow(0 0 20px #4ade80)}100%{transform:scale(1);filter:brightness(1)}}
.fxShieldGlow{animation:shieldGlow 0.6s ease-out}@keyframes shieldGlow{40%{transform:scale(1.1);filter:brightness(1.8) drop-shadow(0 0 20px #60a5fa)}100%{transform:scale(1)}}
.fxSummon{animation:summonBounce 0.55s cubic-bezier(0.175,0.885,0.32,1.275)}@keyframes summonBounce{0%{transform:scale(0.2) translateY(50px);opacity:0}70%{transform:scale(1.1) translateY(-10px);opacity:1}100%{transform:scale(1) translateY(0)}}
.fxDraw{animation:draw 0.65s}@keyframes draw{0%{transform:translateY(-80px) rotate(-15deg);opacity:0}100%{transform:none;opacity:1}}
.screenShake{animation:screenShakeAnim 0.35s ease-in-out}@keyframes screenShakeAnim{20%{transform:translate(-8px,6px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(5px,4px)}100%{transform:translate(0,0)}}
@media(max-width:760px){.deckGrid,.detail{grid-template-columns:1fr}.battle{display:block}.fieldCard{width:110px;height:195px}.fieldCard img{height:105px}.board{grid-template-rows:70px 1fr 1fr 165px}.fieldHalf{padding-left:78px}.fieldHalf.mineHalf{padding-right:78px}.fieldPiles{width:71px;font-size:11px}.handCard{width:100px;height:155px}}
</style></head><body><main id="home" class="home"><h1>🔥고아 카드 게임🔥</h1><button id="nickBtn">닉네임 설정</button><button id="deckBtn">덱 편성</button><button id="matchBtn">매치메이킹</button><button id="botBtn">봇전</button><div id="matchProgress" class="matchProgress hidden"><span class="spinner"></span><span id="matchProgressText">매칭 서버 연결 확인 중...</span></div><div id="status"></div></main>
<section id="nickModal" class="modal hidden"><div class="box"><button data-close="nickModal">닫기</button><h2>닉네임</h2><input id="nickname" maxlength="20" style="width:100%;padding:14px;font-size:18px"><p id="saveText">입력하면 자동 저장됩니다.</p></div></section>
<section id="deckModal" class="modal hidden"><div class="box"><button data-close="deckModal">닫기</button><div class="deckGrid"><section><h2>전체 카드</h2><div id="allCards" class="cardGrid"></div></section><section><h2>내 덱 <span id="deckCount"></span></h2><div id="deckCards" class="cardGrid"></div></section></div></div></section>
<main id="battle" class="battle hidden"><section class="board"><div id="opHand" class="zone"></div><div class="fieldHalf"><aside class="fieldPiles"><div id="opDeck" class="pile">상대 덱</div><div id="opTrash" class="pile">상대 트레쉬</div></aside><div id="opField" class="zone"></div></div><div class="fieldHalf mineHalf"><aside class="fieldPiles mine"><div id="myDeck" class="pile" title="내 턴에 클릭하여 1장 드로우">내 덱</div><div id="myTrash" class="pile">내 트레쉬</div></aside><div id="myField" class="zone dropZone" data-zone="field"></div></div><div id="myHand" class="zone hand"></div></section></main>
<div id="hud" class="hud hidden"><button id="skipBtn">턴 스킵</button></div><div id="turnFx" class="turnFx hidden"></div><div id="targetPrompt" class="targetPrompt hidden">공격할 상대 카드를 선택하세요</div>
<section id="detailModal" class="modal hidden"><div id="detailBox" class="box"></div></section><section id="trashModal" class="modal hidden"><div class="box"><button data-close="trashModal">닫기</button><h2 id="trashTitle"></h2><div id="trashCards" class="trashGrid"></div></div></section>
<script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io({transports:['polling','websocket'],timeout:10000}),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,targetUid=null,saveTimer,lastTurn=-1,dragging=false,matching=false,matchStartedAt=0,matchClock=null,pendingSkill=null;const C=id=>cards.find(c=>c.id===id),isMonster=c=>c?.hp!=null,open=id=>$('#'+id).classList.remove('hidden'),close=id=>$('#'+id).classList.add('hidden');
function compact(c,u=null){const hp=u?u.hp:c.hp;return `<img loading="lazy" decoding="async" src="/${c.image}"><h3>${c.name}</h3>${isMonster(c)?`<b class="hp">HP ${String(hp).padStart(3,'0')}</b>`:''}<div class="skillNames">${(c.skills||[]).map(s=>s.name).join(' / ')}</div>`}function full(c,u){return `<div class="detail"><div><img src="/${c.image}"><h2>${c.name}</h2>${u?`<p>현재 HP <b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b></p>`:''}<div class="tags">${(u?.items||[]).map(id=>`<span class="tag">${C(id)?.name||id}</span>`).join('')||'<span class="tag">장착 없음</span>'}</div></div><div><h2>스킬 및 설명</h2>${(c.skills||[]).map((s,i)=>`<div class="skillBox"><h3>${s.name}</h3><p>${s.description||'설명 없음'}</p>${s.damage!=null?`<p>피해 ${s.damage}</p>`:''}${s.heal!=null?`<p>회복 ${s.heal}</p>`:''}${u&&state.players[state.you].field.some(x=>x.uid===u.uid)?`<button onclick="useSkill('${u.uid}',${i},'${s.type}')">스킬 사용</button>`:''}</div>`).join('')}</div></div>`}
function renderDeck(){const n={};deck.forEach(id=>n[id]=(n[id]||0)+1);allCards.innerHTML=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card').map(c=>`<article class="miniCard" onclick="showCatalogDetail('${c.id}')">${compact(c)}<button onclick="event.stopPropagation();changeDeck('${c.id}',1)">추가 ${n[c.id]||0}/2</button></article>`).join('');deckCards.innerHTML=Object.keys(n).map(C).filter(Boolean).map(c=>`<article class="miniCard" onclick="showCatalogDetail('${c.id}')">${compact(c)}<button onclick="event.stopPropagation();changeDeck('${c.id}',-1)">제거 ${n[c.id]}</button></article>`).join('')||'선택 없음';deckCount.textContent=`${deck.length}/20`}function changeDeck(id,d){const n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20||n>=2)return;deck.push(id)}else{const i=deck.lastIndexOf(id);if(i>=0)deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();queueSave()}
async function saveProfile(){const name=nickname.value.trim();localStorage.goaName=name;localStorage.goaDeck=JSON.stringify(deck);if(!name)return false;try{const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name,deck})});saveText.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}catch{return false}}function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveProfile,250)}nickname.oninput=queueSave;
async function boot(){const[cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();const p=pr.ok?await pr.json():null;if(p){nickname.value=p.name;deck=p.deck}else nickname.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card');renderDeck()}boot().catch(()=>status.textContent='카드 로드 실패');
function showCatalogDetail(id){const c=C(id);detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(c,null)}`;bindClose();open('detailModal')}function fieldCard(u,own){if(!u)return '';const c=C(u.id);return `<article id="unit-${u.uid}" class="fieldCard ${targetUid===u.uid?'selected':''} ${pendingSkill&&!own?'targetReady':''}" data-uid="${u.uid}" ondragover="event.preventDefault()" ondrop="dropOnUnit(event,'${u.uid}')" onclick="showUnit('${u.uid}')">${compact(c,u)}<b class="hp">${String(u.hp).padStart(3,'0')} / ${String(u.maxHp).padStart(3,'0')}</b><span class="equipCount">${u.items.length}</span></article>`}function fan(){const els=[...myHand.children],mid=(els.length-1)/2;els.forEach((el,i)=>{const d=i-mid;el.style.left=`calc(50% - 62px + ${d*66}px)`;el.style.transform=`rotate(${d*6}deg) translateY(${Math.abs(d)*5}px)`;el.style.zIndex=i})}
function render(){const me=state.players[state.you],op=state.players[1-state.you],mine=state.turn===state.you&&!state.ended;opHand.textContent=`상대 패 ${op.handCount}장`;opField.innerHTML=op.field.map(u=>fieldCard(u,false)).join('')||'상대 필드 비어 있음';myField.innerHTML=me.field.map(u=>fieldCard(u,true)).join('')||'내 필드 비어 있음';myHand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="miniCard handCard" draggable="${mine}" data-id="${id}" ondragstart="startDrag(event,'${id}')" ondragend="endDrag()" onclick="if(!dragging)showHand('${id}')">${compact(c)}</article>`}).join('')||'내 패 없음';fan();opDeck.textContent=`상대 덱\n${op.deckCount}장`;opTrash.textContent=`상대 트레쉬\n${op.trash.length}장`;myDeck.textContent=`내 덱\n${me.deckCount}장`;myTrash.textContent=`내 트레쉬\n${me.trash.length}장`;myDeck.classList.toggle('canDraw',mine&&!me.drawn&&me.deckCount>0);myDeck.classList.toggle('disabled',!mine||me.drawn||me.deckCount===0);skipBtn.disabled=!mine;hud.classList.toggle('hidden',state.ended);targetPrompt.classList.toggle('hidden',!pendingSkill);if(lastTurn!==state.turn){lastTurn=state.turn;showTurn(mine?'내 턴':'상대 턴')}}function startDrag(e,id){dragging=true;e.dataTransfer.setData('cardId',id);e.dataTransfer.effectAllowed='move';document.querySelectorAll('.dropZone,.fieldCard').forEach(x=>x.classList.add('dropReady'))}function endDrag(){setTimeout(()=>dragging=false,0);document.querySelectorAll('.dropReady').forEach(x=>x.classList.remove('dropReady'))}
function dropZone(e,zone){e.preventDefault();const id=e.dataTransfer.getData('cardId'),c=C(id);if(!c)return;if(isMonster(c))doAction({type:'play',cardId:id,zone:'field'});else doAction({type:'play',cardId:id});endDrag()}
function dropOnUnit(e,uid){e.preventDefault();e.stopPropagation();const id=e.dataTransfer.getData('cardId'),c=C(id);if(!c)return;if(isMonster(c))return status.textContent='몬스터는 필드에 드롭하세요.';doAction({type:'play',cardId:id,targetUid:uid});endDrag()}document.querySelectorAll('.dropZone').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>dropZone(e,z.dataset.zone)});
function findUnit(uid){for(const p of state.players){const u=p.field.find(x=>x.uid===uid);if(u)return u}}function isMine(uid){return state.players[state.you].field.some(x=>x.uid===uid)}function showUnit(uid){const u=findUnit(uid);if(!u)return;if(pendingSkill&&!isMine(uid)){const action={type:'skill',sourceUid:pendingSkill.sourceUid,skillIndex:pendingSkill.skillIndex,targetUid:uid};pendingSkill=null;targetUid=uid;targetPrompt.classList.add('hidden');render();return doAction(action)}const c=C(u.id),mine=isMine(uid);if(!mine)targetUid=uid;detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(c,u)}`;bindClose();open('detailModal');render()}function showHand(id){detailBox.innerHTML=`<button data-close="detailModal">닫기</button>${full(C(id),null)}<p>${isMonster(C(id))?'필드로 드래그하세요.':'필드나 카드 위로 드래그하여 사용하세요.'}</p>`;bindClose();open('detailModal')}function showTrash(ids,title){trashTitle.textContent=title;trashCards.innerHTML=ids.map(id=>`<article class="miniCard">${compact(C(id))}</article>`).join('')||'비어 있음';open('trashModal')}function useSkill(uid,i,type){close('detailModal');if(['heal','shield','multi'].includes(type))return doAction({type:'skill',sourceUid:uid,skillIndex:i,targetUid:['heal','shield'].includes(type)?uid:null});pendingSkill={sourceUid:uid,skillIndex:i};targetUid=null;status.textContent='공격할 상대 카드를 선택하세요.';render()}function cancelTarget(){pendingSkill=null;targetPrompt.classList.add('hidden');render()}function doAction(a){socket.timeout(5000).emit('game:action',a,(err,res)=>{if(err)status.textContent='서버 응답 없음';else if(!res?.ok)status.textContent=res?.error||'행동 실패'})}myDeck.onclick=()=>{if(!state)return;if(state.ended)return;const me=state.players[state.you];if(state.turn!==state.you)return status.textContent='내 턴에만 드로우할 수 있습니다.';if(me.drawn)return status.textContent='이번 턴에는 이미 드로우했습니다.';if(!me.deckCount)return status.textContent='덱이 비었습니다.';doAction({type:'draw'})};skipBtn.onclick=()=>{pendingSkill=null;doAction({type:'skip'})};function showTurn(text){turnFx.textContent=text;turnFx.className='turnFx';void turnFx.offsetWidth;turnFx.className='turnFx'}

function popFxText(targetEl,text,color='#ffee33'){const rect=targetEl?targetEl.getBoundingClientRect():{left:window.innerWidth/2,top:window.innerHeight/2,width:0,height:0};const pop=document.createElement('div');pop.className='popText';pop.textContent=text;pop.style.color=color;pop.style.left=(rect.left+rect.width/2)+'px';pop.style.top=(rect.top+rect.height/3)+'px';document.body.appendChild(pop);setTimeout(()=>pop.remove(),1100)}
function popBanner(text,bg='linear-gradient(135deg, #2563eb, #1d4ed8)'){const b=document.createElement('div');b.className='itemBanner';b.textContent=text;b.style.background=bg;document.body.appendChild(b);setTimeout(()=>b.remove(),1200)}

function animate(e){
status.textContent=e.text||'';
if(e.kind==='draw'){const el=myHand.lastElementChild;el?.classList.add('fxDraw')}
if(e.kind==='summon'){const el=$('#unit-'+e.uid);if(el){el.classList.add('fxSummon');popFxText(el,'소환!','#60a5fa')}}
if(e.kind==='item'||e.kind==='equip'){
const targetEl=e.targetUid?$('#unit-'+e.targetUid):null;const c=C(e.itemId);const name=c?c.name.replace('\n',' '):'아이템';
const itemFxMap={
'item_potion_1':{banner:'🧪 급식 (체력 +20)',color:'#4ade80',bg:'linear-gradient(135deg, #15803d, #166534)',text:'+20 HP'},
'item_learning_power':{banner:'⚔️ 학습력 (공격력 +15)',color:'#f97316',bg:'linear-gradient(135deg, #c2410c, #9a3412)',text:'+15 ATK'},
'item_acting_power':{banner:'🛡️ 인내력 (피해 -15)',color:'#38bdf8',bg:'linear-gradient(135deg, #0369a1, #075985)',text:'-15 DMG'},
'item_social_power':{banner:'💖 사회친화력 (턴당 +10)',color:'#f472b6',bg:'linear-gradient(135deg, #be185d, #9d174d)',text:'+10/턴'},
'item_kim_seonga_lottery':{banner:'🎟️ 김성아의 제비뽑기 (몬스터 드로우!)',color:'#facc15',bg:'linear-gradient(135deg, #b45309, #78350f)',text:'DRAW!'},
'item_bookbag':{banner:'🎒 책가방 (2장 드로우!)',color:'#c084fc',bg:'linear-gradient(135deg, #6b21a8, #581c87)',text:'+2 CARDS!'},

'item_pop_quiz':{banner:'📝 기습 수행평가 (전원 혼란!)',color:'#ef4444',bg:'linear-gradient(135deg, #991b1b, #7f1d1d)',text:'CONFUSED!'},
'item_hyper_focus':{banner:'🔥 HYPER FOCUS (집중 유효!)',color:'#22d3ee',bg:'linear-gradient(135deg, #0e7490, #155e75)',text:'SURVIVE!'},
'item_cleanse':{banner:'✨ 야 이 시발 (상태이상 해제!)',color:'#67e8f9',bg:'linear-gradient(135deg, #0284c7, #0369a1)',text:'CLEANSED!'},
'item_positive_negative':{banner:'🪙 Positive negative (운명의 동전!)',color:'#fbbf24',bg:'linear-gradient(135deg, #d97706, #b45309)',text:'COIN FLIP!'},
'item_ai_ban':{banner:'🚫 생성형 AI 금지 (손패 덱으로!)',color:'#f87171',bg:'linear-gradient(135deg, #b91c1c, #991b1b)',text:'HAND RESET!'}
};
const cfg=itemFxMap[e.itemId]||{banner:`✨ ${name} 사용!`,color:'#fbbf24',bg:'linear-gradient(135deg, #3b82f6, #1d4ed8)',text:`${name}!`};
popBanner(cfg.banner,cfg.bg);popFxText(targetEl,cfg.text,cfg.color);
if(targetEl){targetEl.classList.add(e.kind==='equip'?'fxShieldGlow':'fxHealGlow');setTimeout(()=>targetEl.classList.remove('fxShieldGlow','fxHealGlow'),600)}
}
if(e.kind==='skill'){
const srcEl=e.sourceUid?$('#unit-'+e.sourceUid):null;const isMine=e.actor===state.you;
if(srcEl){const lunge=isMine?'fxLungeMine':'fxLungeOp';srcEl.classList.add(lunge);setTimeout(()=>srcEl.classList.remove(lunge),480)}
document.body.classList.add('screenShake');setTimeout(()=>document.body.classList.remove('screenShake'),350);
(e.targetUids||[]).forEach(uid=>{
const tgtEl=$('#unit-'+uid);if(!tgtEl)return;
tgtEl.classList.add('fxHitShake');
if(e.element==='electric')tgtEl.classList.add('fxElectric');
if(e.element==='water')tgtEl.classList.add('fxWater');
setTimeout(()=>tgtEl.classList.remove('fxHitShake','fxElectric','fxWater'),550);
if(e.damage>0)popFxText(tgtEl,`-${e.damage}`,'#ef4444');
else if(e.heal>0){popFxText(tgtEl,`+${e.heal}`,'#4ade80');tgtEl.classList.add('fxHealGlow');setTimeout(()=>tgtEl.classList.remove('fxHealGlow'),600)}
else popFxText(tgtEl,e.skillName||'스킬!','#facc15');
})
}
}

function setMatchProgress(on,text=''){matching=on;matchProgress.classList.toggle('hidden',!on);matchProgressText.textContent=text;if(on){matchBtn.textContent='매칭 취소';matchStartedAt=Date.now();clearInterval(matchClock);matchClock=setInterval(()=>{const sec=Math.floor((Date.now()-matchStartedAt)/1000);matchProgressText.textContent=`상대를 찾는 중... ${sec}초`},1000)}else{clearInterval(matchClock);matchClock=null,pendingSkill=null;matchBtn.textContent='매치메이킹'}}function cancelMatch(){socket.emit('match:cancel');setMatchProgress(false);status.textContent='매칭을 취소했습니다.'}function setConnectionText(text){if(!matching)status.textContent=text}async function ready(){if(!socket.connected){status.textContent='서버 연결 중';socket.connect();return false}if(!nickname.value.trim()||!deck.some(id=>C(id)?.hp!=null)){status.textContent='닉네임과 몬스터 포함 덱이 필요합니다.';return false}return saveProfile()}matchBtn.onclick=async()=>{if(matching)return cancelMatch();status.textContent='매칭 서버 연결 확인 중...';if(!await ready())return;setMatchProgress(true,'매칭 요청 전송 중...');socket.timeout(5000).emit('match:join',pid,(e,r)=>{if(e){setMatchProgress(false);status.textContent='매칭 서버 응답 없음. 잠시 후 다시 눌러 주세요.'}else if(!r?.ok){setMatchProgress(false);status.textContent=r?.error||'매칭 요청 실패'}else{status.textContent='매칭 대기열에 등록되었습니다.'}})};botBtn.onclick=async()=>{if(matching)cancelMatch();status.textContent='봇전 준비 중...';if(await ready())socket.timeout(5000).emit('bot:start',pid,(e,r)=>status.textContent=e?'봇전 서버 응답 없음':r?.ok?'봇전 시작 중...':r?.error)};nickBtn.onclick=()=>open('nickModal');deckBtn.onclick=()=>{renderDeck();open('deckModal')};opTrash.onclick=()=>state&&showTrash(state.players[1-state.you].trash,'상대 트레쉬');myTrash.onclick=()=>state&&showTrash(state.players[state.you].trash,'내 트레쉬');function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close))}bindClose();document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)close(m.id)});
socket.on('connect',()=>setConnectionText('멀티플레이 서버 연결됨'));socket.on('connect_error',()=>{setMatchProgress(false);status.textContent='멀티플레이 서버 연결 실패'});socket.on('disconnect',()=>{setMatchProgress(false);status.textContent='멀티플레이 서버 연결이 끊겼습니다.'});socket.on('match:waiting',t=>{if(!matching)setMatchProgress(true,t);status.textContent='매칭 대기열에 등록됨'});socket.on('match:cancelled',()=>{setMatchProgress(false);status.textContent='매칭을 취소했습니다.'});socket.on('game:state',s=>{setMatchProgress(false);state=s;home.classList.add('hidden');battle.classList.remove('hidden');hud.classList.remove('hidden');render()});socket.on('game:event',e=>setTimeout(()=>animate(e),40));
</script></body></html>
