<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui;background:#101828 url('/image/background.png') center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#0008;z-index:-1}.home{min-height:100vh;display:grid;place-content:center;gap:18px}.home>button{width:min(370px,82vw);padding:21px;border:1px solid #bdd0ff;border-radius:16px;background:#243e80eb;color:#fff;font-size:24px;font-weight:800;cursor:pointer}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px;z-index:5}.box{width:min(1250px,97vw);max-height:92vh;overflow:auto;background:#111b31;border:1px solid #7894d7;border-radius:18px;padding:18px}.hidden{display:none!important}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.column{min-width:0;background:#091225;padding:14px;border-radius:14px}.cards,.field,.hand{display:flex;flex-wrap:wrap;gap:10px}.card{width:165px;background:#202d49;border:2px solid #536b99;border-radius:14px;padding:9px;position:relative}.card img{width:100%;height:110px;object-fit:cover;border-radius:9px;background:#111}.card h3{margin:7px 0;font-size:15px}.card p{font-size:11px;margin:5px 0}.qty{position:absolute;right:5px;top:5px;background:#ffd04d;color:#111;border-radius:50%;padding:5px 9px}.btn,.card button{border:0;border-radius:8px;padding:9px;margin:3px;background:#617fd5;color:white;cursor:pointer}input{padding:14px;font-size:18px;width:100%;border-radius:10px}.game{max-width:1150px;margin:auto;padding:20px;background:#08101ddd;min-height:100vh}.selected{outline:4px solid #ffd04d}#toast{position:fixed;top:16px;right:16px;background:#000e;padding:13px;z-index:8;border-radius:9px}@media(max-width:800px){.deckGrid{grid-template-columns:1fr}.card{width:calc(50% - 5px)}}
</style></head><body><main id="home" class="home"><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deckModal')">덱 편성</button><button id="match">매치메이킹</button></main>
<section id="nick" class="modal hidden"><div class="box"><button class="btn" onclick="closeM('nick')">닫기</button><h2>닉네임 설정</h2><input id="name" maxlength="20" placeholder="닉네임"><p id="saved">입력하면 자동 저장됩니다.</p></div></section>
<section id="deckModal" class="modal hidden"><div class="box"><button class="btn" onclick="closeM('deckModal')">닫기</button><div class="deckGrid"><section class="column"><h2>편성 가능한 카드</h2><div id="available" class="cards"><p>카드 불러오는 중...</p></div></section><section class="column"><h2>선택한 덱 <span id="count">0/20</span></h2><div id="selectedDeck" class="cards"><p>선택한 카드가 없습니다.</p></div></section></div></div></section>
<main id="game" class="game hidden"><h2 id="turn"></h2><h3>상대 필드</h3><div id="enemy" class="field"></div><h3>내 필드</h3><div id="mine" class="field"></div><h3>내 손패</h3><div id="hand" class="hand"></div></main><div id="toast" class="hidden"></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io(),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,sel,timer;const C=id=>cards.find(c=>c.id===id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function openM(id){$('#'+id).classList.remove('hidden')}function closeM(id){$('#'+id).classList.add('hidden')}function art(c){return `<img src="/${esc(c.image)}" alt="${esc(c.name)}" onerror="this.alt='이미지 없음'">`}function info(c){return `<h3>${esc(c.name)}</h3><b>HP ${c.hp??'-'}</b>${(c.skills||[]).map(s=>`<p><b>${esc(s.name)}</b><br>${esc(s.description||'')}</p>`).join('')}`}function card(c,side,n=0){return `<article class="card">${n?`<i class="qty">${n}</i>`:''}${art(c)}${info(c)}<button onclick="change('${c.id}',${side==='add'?1:-1})">${side==='add'?'덱에 추가':'덱에서 제거'}</button></article>`}
function renderDeck(){const usable=cards.filter(c=>!c.isUnobtainable),counts={};deck.forEach(id=>counts[id]=(counts[id]||0)+1);available.innerHTML=usable.map(c=>card(c,'add',counts[c.id]||0)).join('')||'<p>편성 가능한 카드가 없습니다.</p>';const chosen=Object.keys(counts).map(id=>C(id)).filter(Boolean);selectedDeck.innerHTML=chosen.map(c=>card(c,'remove',counts[c.id])).join('')||'<p>선택한 카드가 없습니다.</p>';count.textContent=`${deck.length}/20`}
function notify(t){toast.textContent=t;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1800)}function change(id,d){let n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20)return notify('덱은 최대 20장입니다.');if(n>=2)return notify('같은 카드는 최대 2장입니다.');deck.push(id)}else{let i=deck.lastIndexOf(id);if(i<0)return;deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();autoSave()}
async function save(){const nick=name.value.trim();if(!nick)return false;localStorage.goaName=nick;localStorage.goaDeck=JSON.stringify(deck);try{const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name:nick,deck})});saved.textContent=r.ok?'자동 저장됨':'저장 실패';return r.ok}catch{saved.textContent='서버 연결 실패';return false}}function autoSave(){clearTimeout(timer);timer=setTimeout(save,250)}name.oninput=autoSave;
async function boot(){try{const [cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);if(!cr.ok)throw Error('cards');cards=await cr.json();const p=pr.ok?await pr.json():null;if(p){name.value=p.name;deck=p.deck}else name.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable).slice(0,20);renderDeck()}catch(e){available.innerHTML='<p>카드를 불러오지 못했습니다. Render 로그와 cards.json 위치를 확인하세요.</p>';notify('카드 데이터 로드 실패')}}boot();
match.onclick=async()=>{if(!name.value.trim()||!deck.length)return notify('닉네임과 덱을 먼저 설정하세요.');match.disabled=true;match.textContent='매칭 취소';if(!(await save())){match.disabled=false;match.textContent='매치메이킹';return}match.disabled=false;socket.emit('match:join',pid)};match.addEventListener('dblclick',()=>{socket.emit('match:cancel');match.textContent='매치메이킹'});
function unit(m,own){const c=C(m.id);return `<article class="card ${sel===m.uid?'selected':''}" onclick="sel='${m.uid}';renderGame()">${art(c)}${info(c)}<b>현재 HP ${m.hp}/${m.maxHp}</b>${own?(c.skills||[]).map((s,i)=>`<button onclick="event.stopPropagation();useSkill('${m.uid}',${i})">${esc(s.name)}</button>`).join(''):''}</article>`}function renderGame(){const me=state.players[state.you],op=state.players[1-state.you];turn.textContent=state.ended?`게임 종료 · 승자: ${state.winner}`:state.turn===state.you?'내 턴':'상대 턴';mine.innerHTML=me.field.map(x=>unit(x,true)).join('')||'<p>비어 있음</p>';enemy.innerHTML=op.field.map(x=>unit(x,false)).join('')||'<p>비어 있음</p>';hand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="card">${art(c)}${info(c)}<button onclick="play('${id}')">사용</button></article>`}).join('')||'<p>손패 없음</p>'}function play(id){socket.emit('game:action',{type:'play',cardId:id,targetUid:sel})}function useSkill(uid,i){socket.emit('game:action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:sel})}
socket.on('connect',()=>{match.disabled=false});socket.on('disconnect',()=>notify('멀티플레이 서버 연결이 끊겼습니다.'));socket.on('match:waiting',t=>{match.textContent='매칭 중...';notify(t)});socket.on('app:error',t=>{match.textContent='매치메이킹';notify(t)});socket.on('game:effect',x=>notify(x.text));socket.on('game:state',s=>{state=s;home.classList.add('hidden');game.classList.remove('hidden');document.querySelectorAll('.modal').forEach(x=>x.classList.add('hidden'));sel=null;renderGame()});
</script></body></html>
