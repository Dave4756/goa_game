<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>고아 카드 게임</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui;background:#101828 url('/image/background.png') center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#0007;z-index:-1}.home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}.title{font-size:clamp(38px,7vw,76px);text-align:center;text-shadow:0 4px 18px #000}.home>button{width:min(390px,84vw);height:66px;border:1px solid #c4d4ff;border-radius:16px;background:#263f82ed;color:#fff;font-size:23px;font-weight:800}.status{font-weight:800;min-height:25px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;z-index:5}.box{width:min(1250px,97vw);max-height:92vh;overflow:auto;background:#111b31;border:1px solid #7894d7;border-radius:18px;padding:18px}.deckGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.column{background:#091225;padding:12px;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.card{min-width:0;background:#202d49;border:2px solid #536b99;border-radius:12px;padding:8px;position:relative}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.card h3{height:38px;overflow:hidden;margin:6px 0;font-size:14px}.desc{height:72px;overflow:auto;font-size:10px}.card button,.btn{border:0;border-radius:7px;min-height:35px;background:#6683d9;color:#fff;margin:3px;padding:7px}.qty{position:absolute;right:4px;top:4px;background:#ffd04d;color:#111;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}.battleScreen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 115px;gap:10px;padding:10px;background:linear-gradient(#ed7f8f 0 49%,#b9d5fa 51% 100%)}.board{display:grid;grid-template-rows:auto 1fr 1fr auto;gap:8px}.side{display:grid;grid-template-rows:1fr 1fr 1fr 1fr;gap:10px}.zone{border:2px dashed #ffffffaa;border-radius:13px;padding:7px;min-height:90px;background:#ffffff20}.row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.activeZone{display:grid;place-items:center}.battleCard{width:150px;background:#26324d;border:2px solid #fff;border-radius:10px;padding:7px}.battleCard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px}.battleCard h3{font-size:13px;margin:4px}.battleCard p{font-size:10px}.selected{outline:4px solid #ffd900}.pile{display:grid;place-items:center;text-align:center;background:#16233dd9;border:2px solid #d7e2ff;border-radius:12px;font-weight:800}.hand{display:flex;justify-content:center;gap:7px;overflow-x:auto}.hand .battleCard{flex:0 0 135px}input{width:100%;padding:14px;font-size:18px;border-radius:9px}#toast{position:fixed;right:15px;top:15px;background:#000e;padding:12px;border-radius:9px;z-index:9}@media(max-width:800px){.deckGrid{grid-template-columns:1fr}.battleScreen{grid-template-columns:1fr 78px}.battleCard{width:120px}.side{font-size:11px}}
</style></head><body><main id="home" class="home"><h1 class="title">🔥고아 카드 게임🔥</h1><button onclick="openM('nick')">닉네임 설정</button><button onclick="openM('deckModal')">덱 편성</button><button id="matchBtn">매치메이킹</button><button id="botBtn">봇전</button><div id="status" class="status"></div></main>
<section id="nick" class="modal hidden" onclick="if(event.target===this)closeM('nick')"><div class="box" onclick="event.stopPropagation()"><button class="btn" onclick="closeM('nick')">닫기</button><h2>닉네임 설정</h2><input id="nameInput" maxlength="20"><p id="saveState">자동 저장</p></div></section>
<section id="deckModal" class="modal hidden" onclick="if(event.target===this)closeM('deckModal')"><div class="box" onclick="event.stopPropagation()"><button class="btn" onclick="closeM('deckModal')">닫기</button><div class="deckGrid"><section class="column"><h2>편성 가능 카드</h2><div id="available" class="cards"></div></section><section class="column"><h2>선택 덱 <span id="deckCount"></span></h2><div id="chosen" class="cards"></div></section></div></div></section>
<main id="battle" class="battleScreen hidden"><section class="board"><div id="opHand" class="zone row"></div><div><div id="opBench" class="zone row"></div><div id="opActive" class="zone activeZone"></div></div><div><div id="myActive" class="zone activeZone"></div><div id="myBench" class="zone row"></div></div><div id="myHand" class="zone hand"></div></section><aside class="side"><div id="opDeck" class="pile"></div><div id="opTrash" class="pile"></div><div id="myTrash" class="pile"></div><div id="myDeck" class="pile"></div></aside></main><div id="toast" class="hidden"></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),socket=io({transports:['websocket','polling']}),pid=localStorage.goaId||(localStorage.goaId=crypto.randomUUID());let cards=[],deck=JSON.parse(localStorage.goaDeck||'[]'),state,sel,timer,matching=false;const C=id=>cards.find(c=>c.id===id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function openM(id){$('#'+id).classList.remove('hidden')}function closeM(id){$('#'+id).classList.add('hidden')}function img(c){return `<img src="/${esc(c.image)}">`}function details(c){return `<h3>${esc(c.name)}</h3>${c.hp!=null?`<b>HP ${c.hp}</b>`:''}<div class="desc">${(c.skills||[]).map(s=>`<p><b>${esc(s.name)}</b><br>${esc(s.description||'')}</p>`).join('')}</div>`}function deckCard(c,add,n){return `<article class="card">${n?`<i class="qty">${n}</i>`:''}${img(c)}${details(c)}<button onclick="change('${c.id}',${add?1:-1})">${add?'추가':'제거'}</button></article>`}
function renderDeck(){const n={};deck.forEach(id=>n[id]=(n[id]||0)+1);const usable=cards.filter(c=>!c.isUnobtainable&&c.id!=='dummy_card');available.innerHTML=usable.map(c=>deckCard(c,true,n[c.id]||0)).join('');chosen.innerHTML=Object.keys(n).map(C).filter(Boolean).map(c=>deckCard(c,false,n[c.id])).join('')||'<p>선택 카드 없음</p>';deckCount.textContent=`${deck.length}/20`}function toastMsg(t){toast.textContent=t;toast.classList.remove('hidden');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.add('hidden'),1800)}function change(id,d){const n=deck.filter(x=>x===id).length;if(d>0){if(deck.length>=20)return toastMsg('최대 20장');if(n>=2)return toastMsg('같은 카드 최대 2장');deck.push(id)}else{const i=deck.lastIndexOf(id);if(i<0)return;deck.splice(i,1)}localStorage.goaDeck=JSON.stringify(deck);renderDeck();autoSave()}
async function saveProfile(){const name=nameInput.value.trim();localStorage.goaName=name;localStorage.goaDeck=JSON.stringify(deck);if(!name)return false;try{const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:pid,name,deck})});saveState.textContent=r.ok?'자동 저장됨':'브라우저 저장됨';return r.ok}catch{return false}}function autoSave(){localStorage.goaName=nameInput.value.trim();clearTimeout(timer);timer=setTimeout(saveProfile,250)}nameInput.oninput=autoSave;(async()=>{const[cr,pr]=await Promise.all([fetch('/api/cards'),fetch('/api/profile/'+pid)]);cards=await cr.json();const p=pr.ok?await pr.json():null;if(p){nameInput.value=p.name;deck=p.deck}else nameInput.value=localStorage.goaName||'';deck=deck.filter(id=>C(id)&&!C(id).isUnobtainable&&id!=='dummy_card').slice(0,20);renderDeck()})().catch(()=>toastMsg('카드 로드 실패'));
async function ready(){if(!socket.connected)return toastMsg('서버 연결 실패'),false;if(!nameInput.value.trim()||!deck.length)return toastMsg('닉네임과 덱을 설정하세요.'),false;return saveProfile()}matchBtn.onclick=async()=>{if(matching){socket.emit('match:cancel');return}status.textContent='프로필 확인 중...';if(!await ready())return;matching=true;matchBtn.textContent='매칭 취소';status.textContent='상대를 찾는 중...';socket.emit('match:join',pid)};botBtn.onclick=async()=>{if(await ready())socket.emit('bot:start',pid)};
function bcard(u,own,active=false){if(!u)return '<span>비어 있음</span>';const c=C(u.id);return `<article class="battleCard ${sel===u.uid?'selected':''}" onclick="sel='${u.uid}';renderBattle()">${img(c)}<h3>${esc(c.name)}</h3><b>${u.hp}/${u.maxHp}</b>${active&&own?(c.skills||[]).map((s,i)=>`<button class="btn" onclick="event.stopPropagation();skill('${u.uid}',${i})">${esc(s.name)}</button>`).join(''):''}${!active&&own?`<button class="btn" onclick="event.stopPropagation();socket.emit('game:action',{type:'switch',uid:'${u.uid}'})">교체</button>`:''}</article>`}function renderBattle(){const me=state.players[state.you],op=state.players[1-state.you];opHand.innerHTML=Array(op.handCount).fill('<div class="battleCard">상대 패</div>').join('')||'상대 패 없음';opBench.innerHTML=op.bench.map(u=>bcard(u,false)).join('')||'상대 벤치';opActive.innerHTML=bcard(op.active,false,true);myActive.innerHTML=bcard(me.active,true,true);myBench.innerHTML=me.bench.map(u=>bcard(u,true)).join('')||'내 벤치';myHand.innerHTML=me.hand.map(id=>{const c=C(id);return `<article class="battleCard">${img(c)}<h3>${esc(c.name)}</h3>${c.hp!=null?`<b>HP ${c.hp}</b>`:''}<button class="btn" onclick="socket.emit('game:action',{type:'play',cardId:'${id}',targetUid:sel})">사용</button></article>`}).join('')||'내 패 없음';opDeck.textContent=`상대 덱\n${op.deckCount}장`;opTrash.textContent=`상대 트레쉬\n${op.trash.length}장`;myTrash.textContent=`내 트레쉬\n${me.trash.length}장`;myDeck.textContent=`내 덱\n${me.deckCount}장`}function skill(uid,i){socket.emit('game:action',{type:'skill',sourceUid:uid,skillIndex:i,targetUid:sel})}
socket.on('match:waiting',t=>status.textContent=t);socket.on('match:cancelled',()=>{matching=false;matchBtn.textContent='매치메이킹';status.textContent='취소됨'});socket.on('app:error',t=>toastMsg(t));socket.on('game:effect',x=>toastMsg(x.text));socket.on('game:state',s=>{state=s;home.classList.add('hidden');battle.classList.remove('hidden');sel=null;renderBattle();if(s.ended)toastMsg(`승자: ${s.winner}`)});socket.on('connect_error',()=>status.textContent='서버 연결 실패');
</script></body></html>
